name: Latest selection and correction regressions

on:
  push:
    branches: [main]
    paths:
      - "scripts/pipeline.py"
      - "scripts/verification_legacy.py"
      - "scripts/test_selection_sujets_manques.py"
      - "scripts/test_correction_motifs_bloquants.py"
      - "scripts/test_latest_selection_correction_ci_contract.py"
      - ".github/workflows/latest-selection-correction-ci.yml"
  pull_request:
    paths:
      - "scripts/pipeline.py"
      - "scripts/verification_legacy.py"
      - "scripts/test_selection_sujets_manques.py"
      - "scripts/test_correction_motifs_bloquants.py"
      - "scripts/test_latest_selection_correction_ci_contract.py"
      - ".github/workflows/latest-selection-correction-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Compiler les garde-fous et leurs tests
        run: >-
          python -m py_compile
          scripts/pipeline.py
          scripts/verification_legacy.py
          scripts/test_selection_sujets_manques.py
          scripts/test_correction_motifs_bloquants.py
          scripts/test_latest_selection_correction_ci_contract.py
      - name: Tester les régressions récentes
        run: |
          python scripts/test_selection_sujets_manques.py
          python scripts/test_correction_motifs_bloquants.py
          python scripts/test_latest_selection_correction_ci_contract.py
