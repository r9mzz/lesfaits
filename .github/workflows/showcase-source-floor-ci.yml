name: Showcase source floor contract

on:
  pull_request:
    paths:
      - "scripts/showcase_quality.py"
      - "scripts/test_grille_vitrine_calibrage.py"
      - "scripts/test_showcase_source_floor_mandate.py"
      - ".github/workflows/showcase-source-floor-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/showcase_quality.py"
      - "scripts/test_grille_vitrine_calibrage.py"
      - "scripts/test_showcase_source_floor_mandate.py"
      - ".github/workflows/showcase-source-floor-ci.yml"

jobs:
  source-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/showcase_quality.py scripts/test_showcase_source_floor_mandate.py
      - name: Enforce sourcing floor
        run: PYTHONPATH=scripts python scripts/test_showcase_source_floor_mandate.py
