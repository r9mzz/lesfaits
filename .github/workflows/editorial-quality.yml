name: Qualité éditoriale

on:
  push:
    branches:
      - main
    paths:
      - "data/retirements.json"
      - "scripts/pipeline.py"
      - "scripts/apply_retirements.py"
      - "scripts/editorial_quality.py"
      - "scripts/editorial_depth.py"
      - "scripts/showcase_quality.py"
      - "scripts/run_pipeline.py"
      - "scripts/run_pipeline_v3.py"
      - "scripts/trusted_source_expansion.py"
      - "scripts/reserve_verification_quota.py"
      - "scripts/stamp_publication_times.py"
      - "scripts/summarize_pipeline_log.py"
      - "scripts/article_change_counts.py"
      - "scripts/test_pipeline_editorial_prompt_contract.py"
      - "scripts/test_retirements.py"
      - "scripts/test_editorial_quality.py"
      - "scripts/test_editorial_depth.py"
      - "scripts/test_run_pipeline.py"
      - "scripts/test_run_pipeline_v3.py"
      - "scripts/test_trusted_source_expansion.py"
      - "scripts/test_quota_wait.py"
      - "scripts/test_showcase_quality.py"
      - "scripts/test_titre_trop_long.py"
      - "scripts/test_grille_vitrine_calibrage.py"
      - "scripts/test_showcase_calibration_ci_contract.py"
      - "scripts/test_reserve_verification_quota.py"
      - "scripts/test_stamp_publication_times.py"
      - "scripts/test_summarize_pipeline_log.py"
      - "scripts/test_article_change_counts.py"
      - "scripts/test_bareme_enjeu_divertissement.py"
      - "scripts/test_bareme_selection_ci_contract.py"
      - "scripts/test_json_generation_guillemets.py"
      - "scripts/test_json_generation_ci_contract.py"
      - "scripts/test_citations_ponctuation.py"
      - "scripts/test_citations_ponctuation_ci_contract.py"
      - "scripts/test_acharnement_editorial.py"
      - "scripts/test_acharnement_editorial_ci_contract.py"
      - "scripts/test_editorial_quality_main_push_ci_contract.py"
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/publication-times.yml"
      - ".github/workflows/editorial-quality.yml"
  pull_request:
    paths:
      - "data/retirements.json"
      - "scripts/pipeline.py"
      - "scripts/apply_retirements.py"
      - "scripts/editorial_quality.py"
      - "scripts/editorial_depth.py"
      - "scripts/showcase_quality.py"
      - "scripts/run_pipeline.py"
      - "scripts/run_pipeline_v3.py"
      - "scripts/trusted_source_expansion.py"
      - "scripts/reserve_verification_quota.py"
      - "scripts/stamp_publication_times.py"
      - "scripts/summarize_pipeline_log.py"
      - "scripts/article_change_counts.py"
      - "scripts/test_pipeline_editorial_prompt_contract.py"
      - "scripts/test_retirements.py"
      - "scripts/test_editorial_quality.py"
      - "scripts/test_editorial_depth.py"
      - "scripts/test_run_pipeline.py"
      - "scripts/test_run_pipeline_v3.py"
      - "scripts/test_trusted_source_expansion.py"
      - "scripts/test_quota_wait.py"
      - "scripts/test_showcase_quality.py"
      - "scripts/test_titre_trop_long.py"
      - "scripts/test_grille_vitrine_calibrage.py"
      - "scripts/test_showcase_calibration_ci_contract.py"
      - "scripts/test_reserve_verification_quota.py"
      - "scripts/test_stamp_publication_times.py"
      - "scripts/test_summarize_pipeline_log.py"
      - "scripts/test_article_change_counts.py"
      - "scripts/test_bareme_enjeu_divertissement.py"
      - "scripts/test_bareme_selection_ci_contract.py"
      - "scripts/test_json_generation_guillemets.py"
      - "scripts/test_json_generation_ci_contract.py"
      - "scripts/test_citations_ponctuation.py"
      - "scripts/test_citations_ponctuation_ci_contract.py"
      - "scripts/test_acharnement_editorial.py"
      - "scripts/test_acharnement_editorial_ci_contract.py"
      - "scripts/test_editorial_quality_main_push_ci_contract.py"
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/publication-times.yml"
      - ".github/workflows/editorial-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la syntaxe
        run: >-
          python -m py_compile
          scripts/pipeline.py
          scripts/apply_retirements.py
          scripts/editorial_quality.py
          scripts/editorial_depth.py
          scripts/showcase_quality.py
          scripts/run_pipeline.py
          scripts/run_pipeline_v3.py
          scripts/trusted_source_expansion.py
          scripts/reserve_verification_quota.py
          scripts/stamp_publication_times.py
          scripts/summarize_pipeline_log.py
          scripts/article_change_counts.py
          scripts/test_pipeline_editorial_prompt_contract.py
          scripts/test_retirements.py
          scripts/test_editorial_quality.py
          scripts/test_editorial_depth.py
          scripts/test_run_pipeline.py
          scripts/test_run_pipeline_v3.py
          scripts/test_trusted_source_expansion.py
          scripts/test_quota_wait.py
          scripts/test_showcase_quality.py
          scripts/test_titre_trop_long.py
          scripts/test_grille_vitrine_calibrage.py
          scripts/test_showcase_calibration_ci_contract.py
          scripts/test_reserve_verification_quota.py
          scripts/test_stamp_publication_times.py
          scripts/test_summarize_pipeline_log.py
          scripts/test_article_change_counts.py
          scripts/test_bareme_enjeu_divertissement.py
          scripts/test_bareme_selection_ci_contract.py
          scripts/test_json_generation_guillemets.py
          scripts/test_json_generation_ci_contract.py
          scripts/test_citations_ponctuation.py
          scripts/test_citations_ponctuation_ci_contract.py
          scripts/test_acharnement_editorial.py
          scripts/test_acharnement_editorial_ci_contract.py
          scripts/test_editorial_quality_main_push_ci_contract.py

      - name: Tests de non-régression éditoriale
        run: |
          python scripts/test_pipeline_editorial_prompt_contract.py
          python scripts/test_retirements.py
          python scripts/test_editorial_quality.py
          python scripts/test_editorial_depth.py
          python scripts/test_run_pipeline.py
          python scripts/test_run_pipeline_v3.py
          python scripts/test_trusted_source_expansion.py
          python scripts/test_quota_wait.py
          python scripts/test_titre_trop_long.py
          python scripts/test_showcase_quality.py
          python scripts/test_grille_vitrine_calibrage.py
          python scripts/test_showcase_calibration_ci_contract.py
          python scripts/test_reserve_verification_quota.py
          python scripts/test_stamp_publication_times.py
          python scripts/test_summarize_pipeline_log.py
          python scripts/test_article_change_counts.py
          python scripts/test_bareme_enjeu_divertissement.py
          python scripts/test_bareme_selection_ci_contract.py
          python scripts/test_json_generation_guillemets.py
          python scripts/test_json_generation_ci_contract.py
          python scripts/test_citations_ponctuation.py
          python scripts/test_citations_ponctuation_ci_contract.py
          python scripts/test_acharnement_editorial.py
          python scripts/test_acharnement_editorial_ci_contract.py
          python scripts/test_editorial_quality_main_push_ci_contract.py

      - name: Vérifier la lecture du corpus HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from editorial_quality import parse_article

          files = sorted(Path("articles").glob("*.html"))
          for path in files:
              parse_article(path)
          print(f"{len(files)} articles analysés sans erreur")
          PY
