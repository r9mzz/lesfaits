name: Fenêtre essai isolation

on:
  pull_request:
    paths:
      - 'scripts/fenetres_modeles.py'
      - 'scripts/test_fenetre_essai_isolation.py'
      - '.github/workflows/essai_fournisseur.yml'
      - '.github/workflows/fenetre_essai_isolation_ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/fenetres_modeles.py'
      - 'scripts/test_fenetre_essai_isolation.py'
      - '.github/workflows/essai_fournisseur.yml'
      - '.github/workflows/fenetre_essai_isolation_ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compiler
        run: python -m py_compile scripts/fenetres_modeles.py scripts/test_fenetre_essai_isolation.py
      - name: Vérifier l'isolation production/essai
        run: PYTHONPATH=scripts python scripts/test_fenetre_essai_isolation.py
      - name: Vérifier le marqueur du workflow d'essai
        run: grep -q 'ESSAI_FOURNISSEUR: "1"' .github/workflows/essai_fournisseur.yml
