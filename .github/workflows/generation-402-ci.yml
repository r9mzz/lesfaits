name: Rotation 402 en rédaction

# Run 281 (26/08) : 24 refus 402 « Check your subscription », chacun tuant son
# sujet, pendant que le fact-check rotationnait correctement sur la clé
# suivante. La rédaction ne connaissait que le 429. Ce contrat empêche
# l'asymétrie de revenir.

on:
  push:
    branches: [main]
    paths:
      - "scripts/pipeline.py"
      - "scripts/test_402_rotation_generation.py"
      - ".github/workflows/generation-402-ci.yml"
  pull_request:
    paths:
      - "scripts/pipeline.py"
      - "scripts/test_402_rotation_generation.py"
      - ".github/workflows/generation-402-ci.yml"
  workflow_dispatch:

jobs:
  generation-402:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -q pytest openai requests beautifulsoup4 lxml pypdf pillow feedparser
      - name: Compiler
        run: python -m py_compile scripts/pipeline.py scripts/test_402_rotation_generation.py
      - name: Tester la rotation sur 402
        run: python -m pytest scripts/test_402_rotation_generation.py -q
