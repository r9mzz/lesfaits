name: Test A/B — comparaison modèle Groq

# Déclenchement manuel uniquement — test ponctuel, n'écrit rien en
# production (aucun fichier articles/ ni data/ modifié). Par défaut, compare
# deux modèles Groq encore utilisés par le runtime : openai/gpt-oss-20b et
# openai/gpt-oss-120b. Un fournisseur OpenAI-compatible peut être testé en
# renseignant explicitement sa base et au moins deux modèles compatibles.
on:
  workflow_dispatch:
    inputs:
      modeles:
        description: "Modèles à comparer, séparés par des virgules"
        required: false
        default: "openai/gpt-oss-20b,openai/gpt-oss-120b"
        type: string
      base_url:
        # Vide = Groq. Renseigner bascule le test sur un service compatible
        # OpenAI — sans toucher à la production, ce workflow n'écrit aucun
        # fichier.
        # Bases connues :
        #   Mistral : https://api.mistral.ai/v1
        #   Gemini  : https://generativelanguage.googleapis.com/v1beta/openai
        # ⚠ Tester un AUTRE fournisseur suppose le secret LLM_API_KEY_ESSAI —
        # sans lui, la clé de production part vers la mauvaise base et le test
        # rend un 401 qu'on lirait comme un mauvais modèle.
        description: "Base API (ex : https://api.mistral.ai/v1)"
        required: false
        default: ""
        type: string

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Comparer les modèles
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:   ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:   ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4:   ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5:   ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6:   ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7:   ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8:   ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_9:   ${{ secrets.GROQ_API_KEY_9 }}
          GROQ_API_KEY_10:  ${{ secrets.GROQ_API_KEY_10 }}
          GROQ_API_KEY_11:  ${{ secrets.GROQ_API_KEY_11 }}
          GROQ_API_KEY_12:  ${{ secrets.GROQ_API_KEY_12 }}
          GROQ_API_KEY_13:  ${{ secrets.GROQ_API_KEY_13 }}
          GROQ_API_KEY_14:  ${{ secrets.GROQ_API_KEY_14 }}
          GROQ_API_KEY_15:  ${{ secrets.GROQ_API_KEY_15 }}
          GROQ_API_KEY_16:  ${{ secrets.GROQ_API_KEY_16 }}
          GROQ_API_KEY_17:  ${{ secrets.GROQ_API_KEY_17 }}
          GROQ_API_KEY_18:  ${{ secrets.GROQ_API_KEY_18 }}
          GROQ_API_KEY_19:  ${{ secrets.GROQ_API_KEY_19 }}
          GROQ_API_KEY_20:  ${{ secrets.GROQ_API_KEY_20 }}
          GROQ_API_KEY_21:  ${{ secrets.GROQ_API_KEY_21 }}
          GROQ_API_KEY_22:  ${{ secrets.GROQ_API_KEY_22 }}
          GROQ_API_KEY_23:  ${{ secrets.GROQ_API_KEY_23 }}
          MODELES_TEST:     ${{ inputs.modeles }}
          LLM_BASE_URL:     ${{ inputs.base_url }}
          # ⚠ Une clé PAR FOURNISSEUR. `LLM_API_KEY` est la clé de PRODUCTION
          # (Mistral) : l'envoyer à une autre base produit un 401 et un verdict
          # faux — on croirait le modèle mauvais alors qu'il n'a jamais été
          # interrogé. C'est la panne du 19/08 rejouée sur un banc d'essai, où
          # elle serait plus grave encore : ce workflow existe pour DÉCIDER
          # d'un fournisseur.
          # `LLM_API_KEY_ESSAI` prime quand elle existe ; sinon on retombe sur
          # la clé de production, ce qui reste correct pour tester un autre
          # MODÈLE du même fournisseur (l'usage d'origine).
          LLM_API_KEY:      ${{ secrets.LLM_API_KEY_ESSAI || secrets.LLM_API_KEY }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: python scripts/test_model_compare.py
