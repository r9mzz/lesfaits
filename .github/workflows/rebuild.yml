name: Factuel — Rebuild site

on:
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Cloner lesfaits-site
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git /tmp/site
          cp -r /tmp/site/assets/ ./
          cp -r /tmp/site/data/   ./

      - name: Régénérer les mauvaises images avec Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python3 - << 'PYEOF'
          import os, json, requests, time

          KEY = os.getenv("PEXELS_API_KEY", "")
          with open("data/search.json", encoding="utf-8") as f:
              articles = {a["slug"]: a for a in json.load(f)}

          img_dir = "assets/images"
          FORCE_REGEN = {
              "desensibilisation-sublinguale-allergies-respiratoires": "allergy sublingual drops tongue",
              "immunotherapie-allergenique-sublinguale": "immunotherapy injection allergy clinic",
          }

          targets = list(FORCE_REGEN.keys()) + [fn[:-4] for fn in os.listdir(img_dir)
                     if fn.endswith(".jpg") and os.path.getsize(os.path.join(img_dir, fn)) < 110_000
                     and fn[:-4] not in FORCE_REGEN]

          print(f"{len(targets)} images à régénérer")
          for slug in targets:
              art = articles.get(slug, {})
              kw = FORCE_REGEN.get(slug) or art.get("image_keyword") or art.get("titre", slug.replace("-", " "))
              print(f"  {slug[:50]}", end=" ", flush=True)
              try:
                  r = requests.get(
                      "https://api.pexels.com/v1/search",
                      params={"query": kw, "orientation": "landscape", "per_page": 3, "size": "large"},
                      headers={"Authorization": KEY},
                      timeout=8,
                  )
                  for photo in r.json().get("photos", []):
                      url = photo.get("src", {}).get("large2x") or photo.get("src", {}).get("large", "")
                      ir = requests.get(url, timeout=10)
                      if ir.status_code == 200 and len(ir.content) > 30_000:
                          open(f"{img_dir}/{slug}.jpg", "wb").write(ir.content)
                          print(f"OK {len(ir.content)//1024}KB")
                          break
                  time.sleep(0.5)
              except Exception as e:
                  print(f"ERR {e}")
          PYEOF

      - name: Pousser les images vers lesfaits-site
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          cp -r assets/ /tmp/site/
          cd /tmp/site
          git config user.name  "Factuel Bot"
          git config user.email "bot@factuel.fr"
          git add assets/images/
          git diff --cached --quiet && echo "Aucun changement." && exit 0
          git commit -m "fix: images régénérées avec Pexels"
          git push
