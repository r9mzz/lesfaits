name: Factuel — Rebuild site

on:
  workflow_dispatch: {}

# Partage le même groupe que le déploiement : rebuild et deploy poussent
# tous les deux vers lesfaits-site, ne jamais les laisser tourner en parallèle.
concurrency:
  group: factuel-deploy
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Cloner lesfaits-site
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git /tmp/site
          cp -r /tmp/site/assets/ ./
          cp -r /tmp/site/data/   ./

      - name: Régénérer les images dupliquées ou trop petites
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/fix_images.py

      - name: Pousser les images vers lesfaits-site
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          cp -r assets/ /tmp/site/
          cd /tmp/site
          git config user.name  "Factuel Bot"
          git config user.email "bot@factuel.fr"
          git add assets/images/
          git diff --cached --quiet && echo "Aucun changement." && exit 0
          git commit -m "fix: images régénérées avec Pexels"
          git push
