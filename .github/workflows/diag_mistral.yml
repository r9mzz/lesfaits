name: Diagnostic Mistral (temporaire)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      K1: ${{ secrets.LLM_API_KEY }}
      K5: ${{ secrets.LLM_API_KEY_5 }}
    steps:
      - name: Un appel minimal par modèle et par clé
        run: |
          MODELES="mistral-large-latest mistral-medium-latest mistral-small-latest mistral-small-2603 ministral-14b-2512 ministral-8b-2512 ministral-3b-2512 open-mistral-nemo mistral-medium-2505 mistral-large-2512 codestral-2508 zai-glm-5-3 glm-5-2"
          for NOM in K5 K1; do
            eval "KEY=\$$NOM"
            echo "################ clé $NOM"
            for M in $MODELES; do
              CODE=$(curl -sS -D /tmp/h.txt -o /tmp/b.txt -m 60 -w "%{http_code}" \
                https://api.mistral.ai/v1/chat/completions \
                -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
                -d "{\"model\":\"$M\",\"max_tokens\":5,\"messages\":[{\"role\":\"user\",\"content\":\"Dis ok\"}]}")
              REQ=$(grep -i "^x-ratelimit-limit-req-minute" /tmp/h.txt | tr -d '\r')
              TOK=$(grep -i "^x-ratelimit-limit-tokens-minute" /tmp/h.txt | tr -d '\r')
              MSG=$(head -c 110 /tmp/b.txt | tr '\n' ' ')
              echo "$M | HTTP $CODE | $REQ | $TOK | $MSG"
              sleep 2
            done
          done
