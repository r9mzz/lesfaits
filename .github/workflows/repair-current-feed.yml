name: Repair current feed

on:
  push:
    branches:
      - "agent/fix-current-feed-pubdates"
    paths:
      - ".github/workflows/repair-current-feed.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-current-feed-pubdates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Réparer les dates RSS versionnées
        run: |
          python scripts/normalize_feed_pubdates.py
          python scripts/test_feed_current_state.py
      - name: Sauvegarder uniquement le flux réparé
        run: |
          git config user.name "Les Faits CI"
          git config user.email "ci@lesfaits.info"
          git add feed.xml
          git diff --cached --quiet && exit 0
          git commit -m "Repair committed RSS publication dates"
          git push origin HEAD:agent/fix-current-feed-pubdates
