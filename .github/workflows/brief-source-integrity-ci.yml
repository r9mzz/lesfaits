name: Brief source integrity CI

on:
  pull_request:
    paths:
      - "scripts/run_pipeline_v3.py"
      - "scripts/test_run_pipeline_v3.py"
      - ".github/workflows/brief-source-integrity-ci.yml"

permissions:
  contents: read

jobs:
  brief-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Syntaxe
        run: python -m py_compile scripts/run_pipeline_v3.py scripts/test_run_pipeline_v3.py
      - name: Tests déterministes V3
        run: python scripts/test_run_pipeline_v3.py
