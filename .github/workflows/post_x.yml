name: Factuel — Publication X (07h00)

on:
  schedule:
    # 07h00 Paris — été (CEST UTC+2) : avril–octobre
    - cron: "0 5 * 4-10 *"
    # 07h00 Paris — hiver (CET UTC+1) : novembre–mars
    - cron: "0 6 * 11-12,1-3 *"
  workflow_dispatch:

concurrency:
  group: factuel-post-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout (repo privé)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Publier les nouveaux articles sur X
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ ! -s data/pending_x_posts.txt ]; then
            echo "Aucun article en attente de publication X."
            exit 0
          fi
          python scripts/post_to_x.py data/pending_x_posts.txt
          # Vider le fichier après publication pour éviter les doublons
          > data/pending_x_posts.txt
          git config user.name  "Factuel Bot"
          git config user.email "bot@lesfaits.info"
          git add data/pending_x_posts.txt
          git diff --cached --quiet || git commit -m "chore: slugs X publiés — $(date +'%d/%m/%Y')"
          git push
