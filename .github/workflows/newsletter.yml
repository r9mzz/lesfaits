name: Les Faits — Newsletter après publication

on:
  workflow_run:
    workflows: ["Factuel — Déploiement site"]
    types: [completed]
  workflow_dispatch:
    inputs:
      slot:
        description: "Créneau à envoyer"
        required: true
        default: "matin"
        type: choice
        options: ["matin", "soir"]
      dry_run:
        description: "Générer et contrôler l'aperçu sans envoyer ni contacter Brevo"
        required: false
        default: false
        type: boolean

concurrency:
  group: lesfaits-newsletter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  newsletter:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install requests

      - name: Tester toute la chaîne newsletter
        run: |
          python -m py_compile \
            scripts/generer_digest.py \
            scripts/run_newsletter.py \
            scripts/run_newsletter_brevo_compat.py \
            scripts/harden_newsletter.py \
            scripts/harden_newsletter_v3.py \
            scripts/audit_brevo_form.py \
            scripts/test_newsletter.py \
            scripts/test_run_newsletter.py \
            scripts/test_run_newsletter_brevo_compat.py \
            scripts/test_newsletter_campaigns.py \
            scripts/test_harden_newsletter_v3.py \
            scripts/test_audit_brevo_form.py
          python scripts/test_newsletter.py
          python scripts/test_run_newsletter.py
          python scripts/test_run_newsletter_brevo_compat.py
          python scripts/test_newsletter_campaigns.py
          python scripts/test_harden_newsletter_v3.py
          python scripts/test_audit_brevo_form.py
          node --check src/newsletter.js

      - name: Contrôler le formulaire Brevo réellement publié
        run: python scripts/audit_brevo_form.py

      - name: Identifier le déploiement public et son lot exact
        id: deployment
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth=40 \
            "https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git" \
            /tmp/lesfaits-site

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SLOT="${INPUT_SLOT:-matin}"
            if [ "$SLOT" = "matin" ]; then
              SLOT_MARKER='— 07h00 —'
            else
              SLOT_MARKER='— 18h00 —'
            fi
            COMMIT=$(
              git -C /tmp/lesfaits-site log -40 --pretty='%H%x09%s' \
                | grep -m1 -F -- "$SLOT_MARKER" || true
            )
          else
            COMMIT=$(
              git -C /tmp/lesfaits-site log -40 --pretty='%H%x09%s' \
                | grep -m1 -E '— (07h00|18h00) —' || true
            )
            MESSAGE=$(printf '%s' "$COMMIT" | cut -f2-)
            if printf '%s' "$MESSAGE" | grep -q -F -- '— 07h00 —'; then
              SLOT=matin
            elif printf '%s' "$MESSAGE" | grep -q -F -- '— 18h00 —'; then
              SLOT=soir
            else
              SLOT=""
            fi
          fi

          SHA=$(printf '%s' "$COMMIT" | cut -f1)
          MESSAGE=$(printf '%s' "$COMMIT" | cut -f2-)
          if [ -z "$SHA" ] || [ -z "${SLOT:-}" ]; then
            echo "::error::Impossible d'identifier le déploiement public demandé."
            git -C /tmp/lesfaits-site log -12 --pretty='%h %s'
            exit 1
          fi

          PUBLISHED_AT=$(git -C /tmp/lesfaits-site show -s --format=%cI "$SHA")
          git -C /tmp/lesfaits-site diff-tree \
            --root --no-commit-id --name-only --diff-filter=A -r "$SHA" -- 'articles/*.html' \
            | sed 's|^articles/||; s|\.html$||' \
            | awk 'NF && !seen[$0]++' \
            > "$GITHUB_WORKSPACE/newsletter-slugs.txt"

          PYTHONPATH="$GITHUB_WORKSPACE/scripts:$GITHUB_WORKSPACE" python - <<'PY'
          from pathlib import Path
          from scripts.run_newsletter import read_deployment_slugs

          path = Path("newsletter-slugs.txt")
          slugs = read_deployment_slugs(path)
          print(f"Lot public validé : {len(slugs)} fichier(s) article ajouté(s).")
          for slug in slugs:
              print(f"  - {slug}")
          PY

          echo "Déploiement public : $SHA"
          echo "Créneau : $SLOT"
          echo "Message : $MESSAGE"
          echo "Publié à : $PUBLISHED_AT"
          echo "value=$SLOT" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"
          echo "deployment_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Générer et envoyer le digest
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: "Les Faits"
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(
            --slot "${{ steps.deployment.outputs.value }}"
            --now "${{ steps.deployment.outputs.published_at }}"
            --deployment-id "${{ steps.deployment.outputs.deployment_sha }}"
            --slugs-file "$GITHUB_WORKSPACE/newsletter-slugs.txt"
          )
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/run_newsletter_brevo_compat.py "${ARGS[@]}" 2>&1 | tee newsletter-run.log

      - name: Résumé du contrôle
        if: always()
        run: |
          COUNT=0
          if [ -f newsletter-slugs.txt ]; then
            COUNT=$(grep -cve '^[[:space:]]*$' newsletter-slugs.txt || true)
          fi
          {
            echo "## Newsletter"
            echo ""
            echo "- Créneau : ${{ steps.deployment.outputs.value || 'non déterminé' }}"
            echo "- Déploiement public : ${{ steps.deployment.outputs.deployment_sha || 'non déterminé' }}"
            echo "- Fichiers article ajoutés au déploiement : ${COUNT}"
            if [ -f newsletter-preview.html ]; then
              echo "- Aperçu HTML : généré"
            else
              echo "- Aperçu HTML : aucun article éligible"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver l'aperçu, le lot et le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ steps.deployment.outputs.value || 'controle' }}-${{ github.run_id }}
          path: |
            newsletter-preview.html
            newsletter-slugs.txt
            newsletter-run.log
          if-no-files-found: ignore
          retention-days: 14
