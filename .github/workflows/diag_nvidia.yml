name: Diagnostic NVIDIA (temporaire)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NK: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Liste des modèles puis appel minimal chronométré
        run: |
          B=https://integrate.api.nvidia.com/v1
          echo "KEYLEN $(printf %s "$NK" | wc -c)"
          curl -sS -m 40 -o /tmp/l.json -w "LISTE HTTP %{http_code}\n" "$B/models" -H "Authorization: Bearer $NK"
          python3 - <<'PY'
          import json,re
          try:
              d=json.load(open('/tmp/l.json'))
              ids=sorted(m['id'] for m in d.get('data',[]))
              print("NB MODELES",len(ids))
              print("IDS", " ".join(i for i in ids if re.search(r'nemotron|deepseek|gemma|glm|gpt-oss|llama-3\.[13]|qwen|mistral|kimi|minimax|step',i)))
          except Exception as e:
              print("LISTE ILLISIBLE",e, open('/tmp/l.json').read()[:200])
          PY
          for M in nvidia/nemotron-3-ultra-550b-a55b nvidia/nemotron-3-super-120b-a12b deepseek-ai/deepseek-v4.1-flash google/gemma-4-31b-it; do
            T0=$(date +%s)
            CODE=$(curl -sS -D /tmp/h.txt -o /tmp/b.txt -m 120 -w "%{http_code}" "$B/chat/completions" \
              -H "Authorization: Bearer $NK" -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"max_tokens\":60,\"messages\":[{\"role\":\"user\",\"content\":\"Réponds par une phrase en français sur le journalisme.\"}]}" || echo 000)
            T1=$(date +%s)
            RL=$(grep -iE "^x-ratelimit|^retry-after" /tmp/h.txt | tr -d '\r' | tr '\n' ' ')
            echo "RES $M | HTTP $CODE | $((T1-T0))s | $RL | $(head -c 170 /tmp/b.txt | tr '\n' ' ')"
            sleep 3
          done
