name: Diagnostic NVIDIA (temporaire)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NK: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: gemma encore muet ? puis nemotron-3-ultra avec et sans réflexion
        shell: bash {0}
        run: |
          B=https://integrate.api.nvidia.com/v1
          PROMPT='Réponds UNIQUEMENT par un objet JSON {"problemes":[{"type":"...","extrait":"..."}],"verdict":"ok|ko"} après avoir vérifié cette phrase : « Le gouvernement a annoncé hier 5 milliards d euros de rénovation, selon le ministère. » Liste au moins 2 points de vigilance.'
          essai () {
            NOM="$1"; CORPS="$2"
            T0=$(date +%s)
            CODE=$(curl -sS -o /tmp/b.txt -m 120 -w "%{http_code}" "$B/chat/completions" -H "Authorization: Bearer $NK" -H "Content-Type: application/json" -d "$CORPS" 2>/dev/null)
            T1=$(date +%s)
            R=$(python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/b.txt')); c=d['choices'][0]; m=c['message']; u=d.get('usage',{})
              print("fin=%s content=%d car. reasoning=%d car. completion_tokens=%s | %s" % (c.get('finish_reason'), len(m.get('content') or ''), len(m.get('reasoning_content') or m.get('reasoning') or ''), u.get('completion_tokens'), (m.get('content') or '')[:90].replace(chr(10),' ')))
          except Exception as e:
              print("illisible:", open('/tmp/b.txt').read()[:120].replace(chr(10),' '))
          PY
          )
            echo "RES $NOM | HTTP ${CODE:-000} | $((T1-T0))s | $R"
          }
          P=$(python3 -c "import json,sys;print(json.dumps(sys.argv[1]))" "$PROMPT")
          essai "gemma defaut" "{\"model\":\"google/gemma-4-31b-it\",\"max_tokens\":300,\"messages\":[{\"role\":\"user\",\"content\":$P}]}"
          essai "ultra defaut" "{\"model\":\"nvidia/nemotron-3-ultra-550b-a55b\",\"max_tokens\":300,\"messages\":[{\"role\":\"user\",\"content\":$P}]}"
          essai "ultra enable_thinking=false" "{\"model\":\"nvidia/nemotron-3-ultra-550b-a55b\",\"max_tokens\":300,\"chat_template_kwargs\":{\"enable_thinking\":false},\"messages\":[{\"role\":\"user\",\"content\":$P}]}"
          essai "ultra system 'detailed thinking off'" "{\"model\":\"nvidia/nemotron-3-ultra-550b-a55b\",\"max_tokens\":300,\"messages\":[{\"role\":\"system\",\"content\":\"detailed thinking off\"},{\"role\":\"user\",\"content\":$P}]}"
          essai "ultra /no_think" "{\"model\":\"nvidia/nemotron-3-ultra-550b-a55b\",\"max_tokens\":300,\"messages\":[{\"role\":\"user\",\"content\":\"/no_think $PROMPT\"}]}"
          essai "ultra reasoning_budget=0" "{\"model\":\"nvidia/nemotron-3-ultra-550b-a55b\",\"max_tokens\":300,\"reasoning_budget\":0,\"messages\":[{\"role\":\"user\",\"content\":$P}]}"
