name: Verification explicit attribution contract

on:
  push:
    branches: [main]
    paths:
      - "scripts/verification.py"
      - "scripts/test_accusation_attribution_explicit.py"
      - ".github/workflows/verification-explicit-attribution-ci.yml"
  pull_request:
    paths:
      - "scripts/verification.py"
      - "scripts/test_accusation_attribution_explicit.py"
      - ".github/workflows/verification-explicit-attribution-ci.yml"
  workflow_dispatch:

jobs:
  explicit-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances du runtime
        run: pip install -r requirements.txt
      - name: Compiler
        run: python -m py_compile scripts/verification.py scripts/test_accusation_attribution_explicit.py
      - name: Tester les opinions explicitement attribuées
        run: python scripts/test_accusation_attribution_explicit.py
