name: Precise source gate CI

on:
  pull_request:
    paths:
      - "scripts/pipeline.py"
      - "scripts/run_pipeline_v3.py"
      - "scripts/test_pertinence_bloquant.py"
      - ".github/workflows/precise-source-gate-ci.yml"

permissions:
  contents: read

jobs:
  precise-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Syntaxe
        run: python -m py_compile scripts/pipeline.py scripts/run_pipeline_v3.py scripts/test_pertinence_bloquant.py
      - name: Test déterministe
        run: python scripts/test_pertinence_bloquant.py
