name: Deploy publication time contract

on:
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-publication-time-contract-ci.yml"
      - "scripts/test_deploy_publication_time_contract.py"
      - "scripts/stamp_publication_times.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-publication-time-contract-ci.yml"
      - "scripts/test_deploy_publication_time_contract.py"
      - "scripts/stamp_publication_times.py"

permissions:
  contents: read

jobs:
  deploy-publication-time-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntaxe
        run: python -m py_compile scripts/test_deploy_publication_time_contract.py scripts/stamp_publication_times.py
      - name: Contrat d'horodatage du déploiement public
        run: python scripts/test_deploy_publication_time_contract.py
