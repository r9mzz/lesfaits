name: Qualité newsletter

on:
  pull_request:
    paths:
      - "scripts/generer_digest.py"
      - "scripts/run_newsletter.py"
      - "scripts/harden_newsletter.py"
      - "scripts/harden_newsletter_v3.py"
      - "scripts/audit_brevo_form.py"
      - "scripts/apply_retirements.py"
      - "scripts/check_seo.py"
      - "scripts/check_site_integrity.py"
      - "scripts/normalize_publication_metadata.py"
      - "scripts/normalize_source_metadata.py"
      - "scripts/normalize_corpus_indexing.py"
      - "data/retirements.json"
      - "scripts/test_newsletter.py"
      - "scripts/test_run_newsletter.py"
      - "scripts/test_newsletter_campaigns.py"
      - "scripts/test_harden_newsletter_v3.py"
      - "scripts/test_audit_brevo_form.py"
      - "src/newsletter.js"
      - ".github/workflows/newsletter.yml"
      - ".github/workflows/newsletter-quality.yml"
      - ".github/workflows/newsletter-repair.yml"
      - ".github/workflows/deploy.yml"
      - "docs/NEWSLETTER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances du rebuild
        run: pip install -r requirements.txt
      - name: Syntaxe et tests unitaires
        run: |
          python -m py_compile \
            scripts/apply_retirements.py \
            scripts/generer_digest.py \
            scripts/run_newsletter.py \
            scripts/harden_newsletter.py \
            scripts/harden_newsletter_v3.py \
            scripts/audit_brevo_form.py \
            scripts/check_seo.py \
            scripts/check_site_integrity.py \
            scripts/normalize_publication_metadata.py \
            scripts/normalize_source_metadata.py \
            scripts/normalize_corpus_indexing.py \
            scripts/test_newsletter.py \
            scripts/test_run_newsletter.py \
            scripts/test_newsletter_campaigns.py \
            scripts/test_harden_newsletter_v3.py \
            scripts/test_audit_brevo_form.py
          python scripts/test_newsletter.py
          python scripts/test_run_newsletter.py
          python scripts/test_newsletter_campaigns.py
          python scripts/test_harden_newsletter_v3.py
          python scripts/test_audit_brevo_form.py
          node --check src/newsletter.js
      - name: Contrôler le formulaire Brevo réellement publié
        run: python scripts/audit_brevo_form.py
      - name: Reconstruction et audit de toutes les pages
        env:
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: |
          python scripts/apply_retirements.py
          python scripts/pipeline.py --rebuild
          python scripts/patch_articles.py
          python scripts/harden_newsletter_v3.py
          python scripts/harden_newsletter_v3.py --check
          python scripts/check_seo.py
