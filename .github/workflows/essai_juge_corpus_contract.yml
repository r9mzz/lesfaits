name: Juge corpus contract

on:
  pull_request:
    paths:
      - 'scripts/essai_juge_corpus.py'
      - 'scripts/essai_juge_corpus_v2.py'
      - 'scripts/test_essai_juge_corpus_v2.py'
      - '.github/workflows/essai_juge_corpus.yml'
      - '.github/workflows/essai_juge_corpus_contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compiler le diagnostic
        run: python -m py_compile scripts/essai_juge_corpus.py scripts/essai_juge_corpus_v2.py scripts/test_essai_juge_corpus_v2.py
      - name: Tester les populations et le fail-closed
        run: python scripts/test_essai_juge_corpus_v2.py
      - name: Vérifier que le workflow exécute la version corrigée
        run: |
          grep -q 'python scripts/essai_juge_corpus_v2.py' .github/workflows/essai_juge_corpus.yml
          ! grep -q 'python scripts/essai_juge_corpus.py ' .github/workflows/essai_juge_corpus.yml
