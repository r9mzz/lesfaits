name: Verification transient retry contract

on:
  push:
    branches: [main]
    paths:
      - "scripts/verification.py"
      - "scripts/test_verification_transient_retry.py"
      - ".github/workflows/verification-transient-retry-ci.yml"
  pull_request:
    paths:
      - "scripts/verification.py"
      - "scripts/test_verification_transient_retry.py"
      - ".github/workflows/verification-transient-retry-ci.yml"
  workflow_dispatch:

jobs:
  transient-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances du runtime
        run: pip install -r requirements.txt
      - name: Compiler
        run: python -m py_compile scripts/verification.py scripts/test_verification_transient_retry.py
      - name: Tester le retry transitoire et le fail-closed
        run: python scripts/test_verification_transient_retry.py
