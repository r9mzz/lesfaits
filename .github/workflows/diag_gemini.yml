name: Diagnostic Gemini (temporaire)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GK: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Un appel minimal par modèle de texte candidat (2 passes)
        run: |
          MODELES="gemini-3.1-flash-lite gemini-3.1-flash-lite-preview gemini-3.5-flash-lite gemini-flash-lite-latest gemini-3.5-flash gemini-3.6-flash gemini-3.7-flash gemini-3.8-flash gemini-3-flash-preview gemini-flash-latest gemini-3.1-pro-preview gemini-pro-latest"
          for PASSE in 1 2; do
            echo "### passe $PASSE"
            for M in $MODELES; do
              CODE=$(curl -sS -o /tmp/b.txt -m 25 -w "%{http_code}" \
                https://generativelanguage.googleapis.com/v1beta/openai/chat/completions \
                -H "Authorization: Bearer $GK" -H "Content-Type: application/json" \
                -d "{\"model\":\"$M\",\"max_tokens\":20,\"messages\":[{\"role\":\"user\",\"content\":\"Dis ok\"}]}" || echo 000)
              echo "RES $M | HTTP $CODE | $(head -c 110 /tmp/b.txt | tr '\n' ' ')"
              sleep 6
            done
          done
