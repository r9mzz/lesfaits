name: Factuel — Pipeline éditorial

on:
  schedule:
    # Matin : génération à 02h00 UTC (04h00 Paris), publication affichée 07h00
    - cron: "0 2 * * *"
    # Soir : génération à 11h00 UTC (13h00 Paris), publication affichée 18h00
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans générer (dry-run)"
        required: false
        default: "false"
        type: boolean

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Récupérer le code (repo privé) ────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # ── 3. Lancer le pipeline ─────────────────────────────────────────────
      - name: Générer les articles
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/pipeline.py --dry-run
          else
            python scripts/pipeline.py
          fi

      # ── 4. Push des fichiers générés vers le repo public ─────────────────
      - name: Déployer vers lesfaits-site
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          TZ: Europe/Paris
        run: |
          # Cloner le repo public
          git clone https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git /tmp/site

          # Copier les fichiers générés
          cp -r articles/            /tmp/site/
          cp -r categories/          /tmp/site/
          cp -r assets/              /tmp/site/
          cp -r data/                /tmp/site/
          cp    index.html           /tmp/site/
          cp    archive.html         /tmp/site/
          cp    feed.xml             /tmp/site/
          cp    sitemap.xml          /tmp/site/
          cp    robots.txt           /tmp/site/ 2>/dev/null || true
          cp    manifest.json        /tmp/site/ 2>/dev/null || true
          cp    recherche.html       /tmp/site/
          cp    mentions-legales.html /tmp/site/
          cp    confidentialite.html  /tmp/site/ 2>/dev/null || true
          cp    cgu.html              /tmp/site/ 2>/dev/null || true
          cp    contact.html          /tmp/site/ 2>/dev/null || true
          cp    methode.html          /tmp/site/ 2>/dev/null || true
          cp    corrections.html      /tmp/site/ 2>/dev/null || true
          cp -r src/                  /tmp/site/ 2>/dev/null || true

          cd /tmp/site
          git config user.name  "Factuel Bot"
          git config user.email "bot@factuel.fr"

          git add -A
          git diff --cached --quiet && echo "Aucun changement à déployer." && exit 0

          NB=$(git diff --cached --name-only | grep "^articles/" | wc -l)
          CRENEAU=$([ $(date +%H) -lt 12 ] && echo "matin" || echo "soir")
          git commit -m "✦ ${NB} article(s) — créneau ${CRENEAU} — $(date +'%d/%m/%Y %H:%M')"
          git push
