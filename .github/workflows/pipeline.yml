name: Factuel — Génération articles

on:
  schedule:
    # NOTE : les crons GitHub sur runners partagés sont régulièrement retardés
    # de 1 à 4h (surtout à la minute 0, la plus chargée). On planifie donc la
    # génération TRÈS en avance sur le déploiement (07h/18h Paris) pour que le
    # lot soit toujours prêt même avec un gros retard, et sur une minute non
    # ronde pour réduire l'attente en file.
    # Matin ~02h10 Paris — été (CEST UTC+2) : avril–octobre.
    # HISTORIQUE À NE PAS RÉPÉTER : ce cron a été calé à 00h10 UTC le 18/07 en
    # croyant que le quota Groq (TPD) se réinitialisait à minuit UTC, pour que
    # le run parte « avec des tokens frais ». C'EST FAUX — mesuré le 29/07 : le
    # TPD est une fenêtre glissante de 24 h. Sur le run de 03h34 UTC, Groq
    # annonçait des libérations entre 03h46 et 05h40 ; un reset à minuit aurait
    # renvoyé « try again in ~20h26m » sur toutes les clés. Il n'existe donc
    # AUCUNE heure de départ « avec quota frais » : le budget disponible ne
    # dépend que de ce qui a été consommé dans les 24 h précédentes. L'heure du
    # cron n'a d'importance que pour espacer les deux runs et laisser la marge
    # avant le déploiement de 07h — ce que 00h10 fait correctement, d'où son
    # maintien. Le vrai levier est de limiter le nombre de runs par jour.
    - cron: "10 0 * * *"
    # Soir ~13h05 Paris — été (CEST UTC+2) : avril–octobre
    - cron: "5 11 * 4-10 *"
    # Soir ~13h05 Paris — hiver (CET UTC+1) : novembre–mars
    - cron: "5 12 * 11-12,1-3 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans générer (dry-run)"
        required: false
        default: "false"
        type: boolean
      forcer:
        description: "Forcer même si un run vient d'avoir lieu"
        required: false
        default: "false"
        type: boolean
      base_url:
        # Essai contrôlé d'un FOURNISSEUR, même logique que `modele` : ne vaut
        # que pour ce déclenchement, donc un essai ne peut pas laisser la
        # production sur un service non validé.
        description: "Base API pour cet essai (ex : https://api.mistral.ai/v1)"
        required: false
        default: ""
        type: string
      modele:
        # Essai contrôlé d'un modèle, SANS toucher au défaut des runs
        # programmés — c'est toute la différence avec la variable de dépôt
        # `vars.GROQ_MODEL_OVERRIDE`, qui s'appliquerait à tous les runs
        # suivants. Sert à répondre par la mesure à une question qu'on ne peut
        # pas trancher par supposition : par exemple, `groq/compound` est un
        # système agentique doté d'outils côté serveur — va-t-il chercher des
        # faits ABSENTS des extraits fournis, ce qu'interdit la règle 5 de la
        # charte ? Vide = comportement inchangé.
        description: "Modèle Groq pour cet essai seulement (ex : groq/compound)"
        required: false
        default: ""
        type: string

# Empêche deux exécutions simultanées (cron + déclenchement manuel qui se
# chevauchent) de pousser des commits concurrents sur le même dépôt — mises
# en file plutôt qu'annulées pour ne jamais couper une génération en cours.
concurrency:
  group: factuel-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 5 h : la génération démarre à 01h05/13h05 Paris et le déploiement suivant
    # est à ~06h/18h — on laisse le job attendre les fenêtres de rate limit
    # Groq aussi longtemps qu'il le faut plutôt que de sauter des sujets.
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Garde-fou : ignorer un déclenchement trop rapproché ──────────────
      # Un automate EXTERNE au dépôt déclenche pipeline.yml à 15h00 ET 15h50
      # UTC chaque jour. Avec une fenêtre de 120 min, le premier déclenchement
      # externe passait encore plusieurs heures après le cron du soir et créait
      # un troisième run quotidien, consommant inutilement le quota glissant.
      # Six heures couvrent ce chevauchement tout en laissant le bouton « forcer »
      # disponible pour une relance humaine réellement volontaire.
      - name: Ignorer si un run vient d'avoir lieu
        id: garde
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCER: ${{ inputs.forcer }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          FENETRE_MIN=360
          if [ "$EVENEMENT" != "workflow_dispatch" ]; then
            echo "Run planifié ($EVENEMENT) — jamais filtré."
            echo "passer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCER" = "true" ]; then
            echo "Forçage demandé — garde-fou ignoré."
            echo "passer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline.yml/runs?per_page=30" \
            > /tmp/runs.json || echo '{}' > /tmp/runs.json
          PRECEDENT=$(python3 scripts/dernier_run.py /tmp/runs.json "$GITHUB_RUN_ID")
          if [ "$PRECEDENT" = "0" ]; then
            echo "Aucun run précédent — on continue."
            echo "passer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ECART=$(( ($(date -u +%s) - PRECEDENT) / 60 ))
          echo "Dernier run il y a ${ECART} min (fenêtre : ${FENETRE_MIN} min)."
          if [ "$ECART" -lt "$FENETRE_MIN" ]; then
            echo "::notice::Run ignoré — un run a déjà eu lieu il y a ${ECART} min. Option « forcer » pour outrepasser."
            echo "passer=true" >> "$GITHUB_OUTPUT"
          else
            echo "passer=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python
        if: steps.garde.outputs.passer != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        if: steps.garde.outputs.passer != 'true'
        run: pip install -r requirements.txt

      # ── Noms indéfinis : la classe d'erreur qui a coûté deux jours ────────
      # Le 13/08, `juger_pertinence_sources(sujet.get(...))` a été poussé alors
      # que le paramètre s'appelle `item`. `NameError` sur le PREMIER sujet des
      # deux runs suivants, avant toute génération — et le repli interne du
      # juge ne pouvait rien y faire, l'erreur survenant en évaluant l'argument,
      # donc avant l'appel. Aucun test unitaire ne voit ça : ils exercent la
      # fonction, jamais son site d'appel.
      #
      # py_compile ne détecte PAS un nom indéfini (la syntaxe est valide).
      # pyflakes le fait en une seconde, sans réseau et sans quota. On ne
      # bloque que sur cette famille : les autres avertissements (imports
      # inutilisés…) sont nombreux et sans conséquence à l'exécution.
      - name: Noms indéfinis (pyflakes)
        if: steps.garde.outputs.passer != 'true'
        run: |
          pip install --quiet pyflakes
          if python -m pyflakes scripts/*.py | grep -i "undefined name"; then
            echo "::error::Nom indéfini détecté — le run échouerait à l'exécution."
            exit 1
          fi
          echo "Aucun nom indéfini."

      - name: Prévol qualité vitrine
        if: steps.garde.outputs.passer != 'true'
        run: |
          python -m py_compile scripts/run_pipeline.py scripts/run_pipeline_v3.py scripts/editorial_ranking.py scripts/showcase_quality.py scripts/summarize_pipeline_log.py
          python scripts/test_editorial_quality.py
          python scripts/test_editorial_depth.py
          python scripts/test_run_pipeline.py
          python scripts/test_editorial_ranking.py
          python scripts/test_quota_wait.py
          python scripts/test_showcase_quality.py
          python scripts/test_summarize_pipeline_log.py

      # ── 3. Récupérer les images existantes pour le dédup MD5 ────────────
      - name: Récupérer les images depuis lesfaits-site
        if: steps.garde.outputs.passer != 'true'
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          git clone --depth=1 https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git /tmp/site
          mkdir -p assets/images
          cp /tmp/site/assets/images/*.jpg assets/images/ 2>/dev/null || true
          echo "$(ls assets/images/*.jpg 2>/dev/null | wc -l) images chargées pour dédup"

      # ── 4. Générer les articles ───────────────────────────────────────────
      - name: Générer les articles
        if: steps.garde.outputs.passer != 'true'
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:   ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:   ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4:   ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5:   ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6:   ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_19:  ${{ secrets.GROQ_API_KEY_19 }}
          GROQ_API_KEY_20:  ${{ secrets.GROQ_API_KEY_20 }}
          GROQ_API_KEY_21:  ${{ secrets.GROQ_API_KEY_21 }}
          GROQ_API_KEY_22:  ${{ secrets.GROQ_API_KEY_22 }}
          GROQ_API_KEY_23:  ${{ secrets.GROQ_API_KEY_23 }}
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_WAIT_MAX_MINUTES: "150"
          MAX_SHOWCASE_PUBLICATIONS: "1"
          # Trappe de sortie, raccordée le 17/08. `pipeline.py` lit déjà
          # GROQ_MODEL_OVERRIDE depuis toujours (ligne 57) mais ce workflow ne la
          # transmettait pas : la trappe existait sans être branchée. Le jour où
          # Groq a retiré `llama-3.3-70b-versatile`, changer de modèle exigeait
          # un commit, une revue et un merge — alors qu'une variable de dépôt
          # suffit. Vide = le défaut codé dans pipeline.py s'applique.
          #
          # ⚠ Le TPM dépend du modèle et conditionne le FORMAT, pas seulement la
          # vitesse : à 8 000 TPM, le prompt système actu (~6 900 tokens) plus
          # les sources minimales dépassent la fenêtre et le format long ne peut
          # PAS tourner, quelle que soit la profondeur d'extrait. Les brèves
          # passent. Vérifier `_TPM_PAR_MODELE` avant de changer cette valeur.
          # L'entrée manuelle prime sur la variable de dépôt : elle ne vaut que
          # pour CE déclenchement, donc un essai ne peut pas laisser le journal
          # sur un modèle non validé.
          GROQ_MODEL_OVERRIDE: ${{ inputs.modele || vars.GROQ_MODEL_OVERRIDE }}
          # Fournisseur — vide = Groq, comportement inchangé. Renseigner
          # LLM_BASE_URL (variable de dépôt) et LLM_API_KEY (secret) bascule
          # l'ensemble des appels sur un service compatible OpenAI, sans
          # toucher au code. Le palier gratuit de Mistral accorde 500 000
          # tokens/minute contre 8 000 chez Groq : le mur qui empêche le format
          # long depuis le 17/08 disparaît. ⚠ La qualité rédactionnelle, elle,
          # n'est PAS garantie par ce changement — le prompt a été calibré deux
          # mois sur Llama. Mesurer avec model_compare.yml avant d'engager la
          # production.
          LLM_BASE_URL: ${{ inputs.base_url || vars.LLM_BASE_URL }}
          # ⚠ CHAQUE CLÉ DOIT ÊTRE CÂBLÉE ICI, une par une. Un secret qui
          # existe dans le dépôt mais qui n'est pas listé dans ce bloc
          # N'ATTEINT PAS le processus : le code lirait LLM_API_KEY_2 dans un
          # environnement où elle n'existe pas et tournerait sur une seule clé,
          # sans que rien ne le signale. C'est le défaut du 10/08 côté Groq —
          # « le pipeline tournait sur 9 clés alors que pipeline.yml en câble
          # 23 », quatre jours sans publication. Ajouter une clé au dépôt sans
          # ajouter sa ligne ici ne sert donc à rien.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_KEY_2: ${{ secrets.LLM_API_KEY_2 }}
          LLM_API_KEY_3: ${{ secrets.LLM_API_KEY_3 }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: |
          set -o pipefail
          PIPELINE_LOG="${RUNNER_TEMP}/lesfaits-pipeline.log"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/run_pipeline_v3.py --dry-run 2>&1 | tee "$PIPELINE_LOG"
          else
            python scripts/run_pipeline_v3.py 2>&1 | tee "$PIPELINE_LOG"
          fi

      - name: Résumer le run
        if: always() && steps.garde.outputs.passer != 'true'
        run: |
          python scripts/summarize_pipeline_log.py \
            --log "${RUNNER_TEMP}/lesfaits-pipeline.log" \
            --json "${RUNNER_TEMP}/pipeline-report.json" \
            --markdown "${RUNNER_TEMP}/pipeline-report.md"
          cat "${RUNNER_TEMP}/pipeline-report.md" >> "$GITHUB_STEP_SUMMARY"

      # ── PANNE D'AUTHENTIFICATION : ne JAMAIS finir en vert ────────────────
      # Les 23 et 24/08, deux runs ont tourné 43 et 59 minutes en produisant 73
      # refus « 402 Check your subscription », zéro article, zéro ligne de
      # journal — et un job GitHub VERT à chaque fois. Trois jours perdus sans
      # qu'aucun signal n'existe : c'est la même famille que le flux RSS qui
      # répond 200 avec 0 article, le pire cas parce qu'il est invisible.
      #
      # Un run qui n'obtient AUCUNE réponse du modèle n'est pas un run sobre,
      # c'est une panne. On la distingue du run éditorialement stérile (zéro
      # article publié parce que rien n'a passé les contrôles), qui reste un
      # SUCCÈS selon la charte — d'où le critère : des refus d'auth ET aucune
      # génération menée à bien.
      - name: Alerter si le fournisseur a tout refusé
        if: always() && steps.garde.outputs.passer != 'true'
        run: |
          LOG="${RUNNER_TEMP}/lesfaits-pipeline.log"
          [ -f "$LOG" ] || exit 0
          REFUS=$(grep -cE "Error code: (401|402|429)" "$LOG" || true)
          OK=$(grep -cE "\[TOKENS\] prompt=" "$LOG" || true)
          echo "Refus d'authentification/quota : ${REFUS} · générations abouties : ${OK}"
          if [ "$REFUS" -gt 0 ] && [ "$OK" -eq 0 ]; then
            echo "::error::Fournisseur injoignable — ${REFUS} refus, aucune génération. Vérifier les clés et le quota sur le fournisseur."
            {
              echo ""
              echo "## ⛔ Panne fournisseur"
              echo ""
              echo "- Refus (401/402/429) : ${REFUS}"
              echo "- Générations abouties : ${OK}"
              echo ""
              echo "Ce run n'a produit AUCUN appel modèle réussi. Ce n'est pas un run stérile, c'est une panne d'accès."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Conserver les diagnostics du run
        if: always() && steps.garde.outputs.passer != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lesfaits-pipeline.log
            ${{ runner.temp }}/pipeline-report.json
            ${{ runner.temp }}/pipeline-report.md
          if-no-files-found: warn
          retention-days: 14

      # ── 5. Commit dans le repo privé (sans déployer sur le site) ─────────
      - name: Sauvegarder les articles générés
        if: steps.garde.outputs.passer != 'true'
        env:
          TZ: Europe/Paris
        run: |
          git config user.name  "Factuel Bot"
          git config user.email "bot@factuel.fr"
          # Le runner part d'un checkout propre et .gitignore exclut secrets,
          # caches et état local. `git add -A` évite désormais toute liste
          # blanche fragile : aucune nouvelle page générée ne peut être oubliée.
          git add -A
          git diff --cached --quiet && echo "Aucun changement à sauvegarder." && exit 0

          NB_NEW=$(git diff --cached --name-only --diff-filter=A -- articles/ | grep -E '\.html$' | wc -l | tr -d ' ')
          NB_MOD=$(git diff --cached --name-only --diff-filter=M -- articles/ | grep -E '\.html$' | wc -l | tr -d ' ')
          NB_DEL=$(git diff --cached --name-only --diff-filter=D -- articles/ | grep -E '\.html$' | wc -l | tr -d ' ')
          CRENEAU=$([ $(date +%H) -lt 12 ] && echo "matin" || echo "soir")

          {
            echo "## Fichiers réellement produits"
            echo ""
            echo "- Nouveaux articles : ${NB_NEW}"
            echo "- Articles reconstruits : ${NB_MOD}"
            echo "- Articles retirés : ${NB_DEL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$NB_NEW" -gt 0 ]; then
            MESSAGE="✦ draft ${NB_NEW} nouveau(x) article(s) — créneau ${CRENEAU} — $(date +'%d/%m/%Y %H:%M')"
          else
            MESSAGE="chore: synchronisation technique — 0 nouvel article — créneau ${CRENEAU} — $(date +'%d/%m/%Y %H:%M')"
          fi
          git commit -m "$MESSAGE"

          PUSHED=0
          for i in 1 2 3 4 5; do
            if git push; then PUSHED=1; break; fi
            echo "Push rejeté (tentative $i) — rebase et nouvel essai..."
            git add -A
            git diff --cached --quiet || git commit --amend --no-edit
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --ours -- data/ index.html archive.html breves.html favoris.html feed.xml sitemap.xml categories/ src/ 2>/dev/null || true
              git add -A
              GIT_EDITOR=true git rebase --continue || git rebase --skip || { echo "Rebase impossible, abandon (commit conservé localement)."; git rebase --abort; break; }
            fi
            sleep 5
          done
          [ "$PUSHED" = "1" ] || { echo "::error::Push impossible après plusieurs tentatives."; exit 1; }
