name: Factuel — Génération articles

on:
  schedule:
    # NOTE : les crons GitHub sur runners partagés sont régulièrement retardés
    # de 1 à 4h (surtout à la minute 0, la plus chargée). On planifie donc la
    # génération TRÈS en avance sur le déploiement (07h/18h Paris) pour que le
    # lot soit toujours prêt même avec un gros retard, et sur une minute non
    # ronde pour réduire l'attente en file.
    # Matin ~02h10 Paris — été (CEST UTC+2) : avril–octobre. Calé à 00h10 UTC
    # (18/07) : le quota JOURNALIER Groq (TPD) se réinitialise à minuit UTC —
    # l'ancien départ à 23h05 UTC faisait démarrer le run 55 min AVANT le
    # reset, sur les fonds de quota de la veille, avec le reset en plein
    # milieu du run. À 00h10 UTC, le run part chaque nuit avec 7 × 100 000
    # tokens frais. La marge avant le déploiement de 07h reste ~5h, au-dessus
    # du pire retard cron observé (~4h le 11/07).
    # (02h10 Paris l'été, 01h10 l'hiver — un seul cron toute l'année, le
    # calage sur le reset UTC ne dépend plus de l'heure de Paris)
    - cron: "10 0 * * *"
    # Soir ~13h05 Paris — été (CEST UTC+2) : avril–octobre
    - cron: "5 11 * 4-10 *"
    # Soir ~13h05 Paris — hiver (CET UTC+1) : novembre–mars
    - cron: "5 12 * 11-12,1-3 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans générer (dry-run)"
        required: false
        default: "false"
        type: boolean
      forcer:
        description: "Forcer même si un run vient d'avoir lieu"
        required: false
        default: "false"
        type: boolean

# Empêche deux exécutions simultanées (cron + déclenchement manuel qui se
# chevauchent) de pousser des commits concurrents sur le même dépôt — mises
# en file plutôt qu'annulées pour ne jamais couper une génération en cours.
concurrency:
  group: factuel-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 5 h : la génération démarre à 01h05/13h05 Paris et le déploiement suivant
    # est à ~06h/18h — on laisse le job attendre les fenêtres de rate limit
    # Groq aussi longtemps qu'il le faut plutôt que de sauter des sujets.
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Garde-fou : ignorer un déclenchement trop rapproché ──────────────
      # Un automate EXTERNE au dépôt déclenche pipeline.yml à 15h00 ET 15h50
      # UTC chaque jour (constat 28/07 : 6 jours consécutifs, à la minute
      # près, en workflow_dispatch — rien dans ce dépôt ni dans les Routines
      # Claude ne le fait). Le second run arrive 50 min après le premier,
      # quand le quota Groq journalier est déjà consommé : vérifié les 25, 26
      # et 27/07, il n'a JAMAIS publié un seul article et se contentait de
      # commiter « draft 0 article(s) ». Le quota Groq est la ressource rare —
      # le découper en 4 runs au lieu de 2 le vide avant le créneau du soir.
      # On neutralise donc tout run démarrant moins de FENETRE_MIN après le
      # précédent ; les deux crons légitimes (00h10 et 11h05 UTC) sont espacés
      # de 11 h et ne sont jamais concernés.
      - name: Ignorer si un run vient d'avoir lieu
        id: garde
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCER: ${{ inputs.forcer }}
        run: |
          FENETRE_MIN=120
          if [ "$FORCER" = "true" ]; then
            echo "Forçage demandé — garde-fou ignoré."
            echo "passer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline.yml/runs?per_page=30" \
            > /tmp/runs.json || echo '{}' > /tmp/runs.json
          PRECEDENT=$(python3 scripts/dernier_run.py /tmp/runs.json "$GITHUB_RUN_ID")
          if [ "$PRECEDENT" = "0" ]; then
            echo "Aucun run précédent — on continue."
            echo "passer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ECART=$(( ($(date -u +%s) - PRECEDENT) / 60 ))
          echo "Dernier run il y a ${ECART} min (fenêtre : ${FENETRE_MIN} min)."
          if [ "$ECART" -lt "$FENETRE_MIN" ]; then
            echo "::notice::Run ignoré — un run a déjà eu lieu il y a ${ECART} min. Relancer si vite ne publierait rien (quota Groq). Option « forcer » pour outrepasser."
            echo "passer=true" >> "$GITHUB_OUTPUT"
          else
            echo "passer=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python
        if: steps.garde.outputs.passer != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        if: steps.garde.outputs.passer != 'true'
        run: pip install -r requirements.txt

      # ── 3. Récupérer les images existantes pour le dédup MD5 ────────────
      - name: Récupérer les images depuis lesfaits-site
        if: steps.garde.outputs.passer != 'true'
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          git clone --depth=1 https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git /tmp/site
          mkdir -p assets/images
          cp /tmp/site/assets/images/*.jpg assets/images/ 2>/dev/null || true
          echo "$(ls assets/images/*.jpg 2>/dev/null | wc -l) images chargées pour dédup"

      # ── 4. Générer les articles ───────────────────────────────────────────
      - name: Générer les articles
        if: steps.garde.outputs.passer != 'true'
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:   ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3:   ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4:   ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5:   ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6:   ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7:   ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8:   ${{ secrets.GROQ_API_KEY_8 }}
          GROQ_API_KEY_9:   ${{ secrets.GROQ_API_KEY_9 }}
          GROQ_API_KEY_10:  ${{ secrets.GROQ_API_KEY_10 }}
          GROQ_API_KEY_11:  ${{ secrets.GROQ_API_KEY_11 }}
          GROQ_API_KEY_12:  ${{ secrets.GROQ_API_KEY_12 }}
          GROQ_API_KEY_13:  ${{ secrets.GROQ_API_KEY_13 }}
          GROQ_API_KEY_14:  ${{ secrets.GROQ_API_KEY_14 }}
          GROQ_API_KEY_15:  ${{ secrets.GROQ_API_KEY_15 }}
          GROQ_API_KEY_16:  ${{ secrets.GROQ_API_KEY_16 }}
          GROQ_API_KEY_17:  ${{ secrets.GROQ_API_KEY_17 }}
          GROQ_API_KEY_18:  ${{ secrets.GROQ_API_KEY_18 }}
          GROQ_API_KEY_19:  ${{ secrets.GROQ_API_KEY_19 }}
          GROQ_API_KEY_20:  ${{ secrets.GROQ_API_KEY_20 }}
          GROQ_API_KEY_21:  ${{ secrets.GROQ_API_KEY_21 }}
          GROQ_API_KEY_22:  ${{ secrets.GROQ_API_KEY_22 }}
          GROQ_API_KEY_23:  ${{ secrets.GROQ_API_KEY_23 }}
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          # Vérification 3 passes (fact-check + correction auto) — le pipeline
          # fonctionne sans, avec statut "non_verifie" sur les articles
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/pipeline.py --dry-run
          else
            python scripts/pipeline.py
          fi

      # ── 4. Commit dans le repo privé (sans déployer sur le site) ─────────
      - name: Sauvegarder les articles générés
        if: steps.garde.outputs.passer != 'true'
        env:
          TZ: Europe/Paris
        run: |
          git config user.name  "Factuel Bot"
          git config user.email "bot@factuel.fr"
          git add articles/ assets/ categories/ data/ index.html archive.html feed.xml sitemap.xml src/ || true
          git diff --cached --quiet && echo "Aucun nouvel article." && exit 0
          NB=$(git diff --cached --name-only | grep "^articles/" | wc -l)
          CRENEAU=$([ $(date +%H) -lt 12 ] && echo "matin" || echo "soir")
          git commit -m "✦ draft ${NB} article(s) — créneau ${CRENEAU} — $(date +'%d/%m/%Y %H:%M')"
          PUSHED=0
          for i in 1 2 3 4 5; do
            if git push; then PUSHED=1; break; fi
            echo "Push rejeté (tentative $i) — rebase et nouvel essai..."
            git fetch origin main
            # Conflits sur les fichiers générés (data/*.json, index, feed…) :
            # consigne du projet — prendre la version de main ("ours" pendant
            # un rebase = la branche amont), les articles nouveaux ne sont
            # jamais en conflit (fichiers créés, pas modifiés).
            if ! git rebase origin/main; then
              git checkout --ours -- data/ index.html archive.html feed.xml sitemap.xml categories/ 2>/dev/null || true
              git add -A
              # --continue si le commit garde du contenu, --skip s'il est
              # devenu vide (run à 0 article dont la seule modif était le
              # fichier en conflit — rien à conserver dans ce cas).
              GIT_EDITOR=true git rebase --continue || git rebase --skip || { echo "Rebase impossible, abandon (commit conservé localement)."; git rebase --abort; break; }
            fi
            sleep 5
          done
          [ "$PUSHED" = "1" ] || { echo "::error::Push impossible après plusieurs tentatives."; exit 1; }
