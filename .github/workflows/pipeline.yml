name: Factuel — Génération articles

on:
  schedule:
    # Matin : génération à 02h00 UTC (04h00 Paris) — 5h avant publication
    - cron: "0 2 * * *"
    # Soir : génération à 11h00 UTC (13h00 Paris) — 5h avant publication
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans générer (dry-run)"
        required: false
        default: "false"
        type: boolean

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # ── 3. Générer les articles ───────────────────────────────────────────
      - name: Générer les articles
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2:   ${{ secrets.GROQ_API_KEY_2 }}
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/pipeline.py --dry-run
          else
            python scripts/pipeline.py
          fi

      # ── 4. Commit dans le repo privé (sans déployer sur le site) ─────────
      - name: Sauvegarder les articles générés
        env:
          TZ: Europe/Paris
        run: |
          git config user.name  "Factuel Bot"
          git config user.email "bot@factuel.fr"
          git add articles/ assets/ categories/ data/ index.html archive.html feed.xml sitemap.xml src/ || true
          git diff --cached --quiet && echo "Aucun nouvel article." && exit 0
          NB=$(git diff --cached --name-only | grep "^articles/" | wc -l)
          CRENEAU=$([ $(date +%H) -lt 12 ] && echo "matin" || echo "soir")
          git commit -m "✦ draft ${NB} article(s) — créneau ${CRENEAU} — $(date +'%d/%m/%Y %H:%M')"
          git push
