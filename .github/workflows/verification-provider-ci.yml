name: Verification provider contract

on:
  pull_request:
    paths:
      - "scripts/verification.py"
      - "scripts/verification_legacy.py"
      - "scripts/json_robuste.py"
      - "scripts/reserve_verification_quota.py"
      - "scripts/test_verification_provider.py"
      - "scripts/test_verification_fail_closed.py"
      - "scripts/test_verification_auth_rotation.py"
      - "scripts/test_reserve_verification_quota.py"
      - "scripts/test_json_sauts_de_ligne.py"
      - "scripts/test_json_mode_verification.py"
      - "scripts/test_verification_json_ci_contract.py"
      - ".github/workflows/verification-provider-ci.yml"
  workflow_dispatch:

jobs:
  verification-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances du runtime
        run: pip install -r requirements.txt
      - name: Compiler
        run: >-
          python -m py_compile
          scripts/verification.py
          scripts/verification_legacy.py
          scripts/json_robuste.py
          scripts/reserve_verification_quota.py
          scripts/test_verification_provider.py
          scripts/test_verification_fail_closed.py
          scripts/test_verification_auth_rotation.py
          scripts/test_reserve_verification_quota.py
          scripts/test_json_sauts_de_ligne.py
          scripts/test_json_mode_verification.py
          scripts/test_verification_json_ci_contract.py
      - name: Tester alignement fournisseur et sécurité de publication
        run: |
          python scripts/test_verification_provider.py
          python scripts/test_verification_fail_closed.py
          python scripts/test_verification_auth_rotation.py
          python scripts/test_reserve_verification_quota.py
          python scripts/test_json_sauts_de_ligne.py
          python scripts/test_json_mode_verification.py
          python scripts/test_verification_json_ci_contract.py
