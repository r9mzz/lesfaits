name: Groq probe contract

on:
  pull_request:
    paths:
      - ".github/workflows/groq_check.yml"
      - ".github/workflows/groq-probe-contract-ci.yml"
      - "scripts/sonde_taille_requete.py"
      - "scripts/test_groq_probe_timeout_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/groq_check.yml"
      - ".github/workflows/groq-probe-contract-ci.yml"
      - "scripts/sonde_taille_requete.py"
      - "scripts/test_groq_probe_timeout_contract.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérifier le contrat de durée de la sonde Groq
        run: |
          python -m py_compile scripts/sonde_taille_requete.py scripts/test_groq_probe_timeout_contract.py
          python scripts/test_groq_probe_timeout_contract.py
