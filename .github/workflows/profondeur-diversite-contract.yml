name: Profondeur et diversité contract

on:
  push:
    branches:
      - main
    paths:
      - "scripts/pipeline.py"
      - "scripts/test_diversite_selection.py"
      - "scripts/test_profondeur_lecture.py"
      - "scripts/test_profondeur_diversite_ci_contract.py"
      - ".github/workflows/profondeur-diversite-contract.yml"
  pull_request:
    paths:
      - "scripts/pipeline.py"
      - "scripts/test_diversite_selection.py"
      - "scripts/test_profondeur_lecture.py"
      - "scripts/test_profondeur_diversite_ci_contract.py"
      - ".github/workflows/profondeur-diversite-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la syntaxe
        run: >-
          python -m py_compile
          scripts/pipeline.py
          scripts/test_diversite_selection.py
          scripts/test_profondeur_lecture.py
          scripts/test_profondeur_diversite_ci_contract.py

      - name: Régressions profondeur et diversité
        run: |
          python scripts/test_diversite_selection.py
          python scripts/test_profondeur_lecture.py
          python scripts/test_profondeur_diversite_ci_contract.py
