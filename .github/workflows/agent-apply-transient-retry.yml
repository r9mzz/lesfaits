name: Agent apply transient verification retry

on:
  pull_request:
    paths:
      - .github/workflows/agent-apply-transient-retry.yml
      - scripts/agent_apply_transient_retry.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retry-transient-verification-errors
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances du runtime
        run: pip install -r requirements.txt
      - name: Appliquer et tester le correctif
        run: |
          python scripts/agent_apply_transient_retry.py
          python -m py_compile scripts/verification.py scripts/test_verification_transient_retry.py
          python scripts/test_verification_transient_retry.py
      - name: Persister le correctif sur la branche
        run: |
          git config user.name "Les Faits CI Watch"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/agent-apply-transient-retry.yml scripts/agent_apply_transient_retry.py
          git add scripts/verification.py scripts/test_verification_transient_retry.py
          git commit -m "fix: relancer une panne transitoire du fact-check"
          git push origin HEAD:agent/retry-transient-verification-errors
