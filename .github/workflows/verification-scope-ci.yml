name: Verification scope CI

on:
  pull_request:
    paths:
      - "scripts/run_pipeline_v3.py"
      - "scripts/test_verification_scope.py"
      - ".github/workflows/verification-scope-ci.yml"

permissions:
  contents: read

jobs:
  verification-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Syntaxe
        run: python -m py_compile scripts/run_pipeline_v3.py scripts/test_verification_scope.py
      - name: Test déterministe
        run: python scripts/test_verification_scope.py
