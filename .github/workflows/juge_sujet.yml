name: Backtest — juge de sujet

# Peut-on écarter un sujet creux AVANT de dépenser ~35 000 jetons à l'écrire ?
#
# 64 % de nos rejets qualité sont des `angle_insuffisant` : le sujet ne valait
# rien, et on ne l'apprend qu'après avoir payé l'article entier. Ce backtest
# rejoue le jugement sur 184 sujets dont l'issue réelle est déjà connue
# (`data/verification_log.json`), avec un petit modèle et une question fermée.
#
# N'écrit RIEN dans le dépôt, ne publie rien, ne touche pas au pipeline.
# Déclenchement manuel uniquement — il consomme du quota Groq, et c'est le
# seul but du bouton : décider en connaissance de cause.

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Nombre de sujets à juger (moitié creux, moitié tenus)"
        required: false
        default: "60"
        type: string
      modele:
        description: "Modèle Groq à interroger"
        required: false
        default: "llama-3.1-8b-instant"
        type: string

# Jamais deux backtests en parallèle : ils se disputeraient le même quota et
# se feraient mutuellement passer pour lents.
concurrency:
  group: juge-sujet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Juger les sujets
        env:
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
          JUGE_MODELE: ${{ inputs.modele }}
          # Une clé secondaire de préférence : le backtest ne doit pas assécher
          # celle que la génération utilisera au prochain run.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_2 || secrets.GROQ_API_KEY }}
        run: python scripts/test_juge_sujet.py --limite "${{ inputs.limite }}"
