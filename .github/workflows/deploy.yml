name: Factuel — Déploiement site

on:
  schedule:
    # Matin : déploiement à 05h00 UTC = 07h00 Paris
    - cron: "0 5 * * *"
    # Soir : déploiement à 16h00 UTC = 18h00 Paris
    - cron: "0 16 * * *"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (repo privé — contient tous les articles)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Rebuild index + catégories + archive
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: python scripts/pipeline.py --rebuild

      - name: Patcher les sections À lire aussi
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 - << 'PYEOF'
          import json, re, os

          with open("data/search.json", encoding="utf-8") as f:
              all_arts = json.load(f)
          arts_by_slug = {a["slug"]: a for a in all_arts}

          patched = 0
          for fn in os.listdir("articles"):
              if not fn.endswith(".html"): continue
              slug = fn[:-5]
              art = arts_by_slug.get(slug)
              if not art: continue
              cat = art.get("categorie", "")
              related = [a for a in all_arts if a.get("categorie") == cat and a["slug"] != slug][:3]
              if not related: continue

              cards = "\n".join(
                  f'<a class="art__related-card" href="articles/{a["slug"]}.html">'
                  f'<img src="assets/images/{a["slug"]}.jpg" alt="" loading="lazy" style="width:calc(100% + 32px);margin:-14px -16px 12px;height:110px;object-fit:cover;display:block;border-radius:var(--radius) var(--radius) 0 0">'
                  f'<span class="cat">{a["categorie"].upper()}</span>'
                  f'<div class="title-sm">{a["titre"]}</div>'
                  f'<div style="font-size:10px;color:var(--muted);margin-top:6px">{a["date"]}</div>'
                  f'</a>'
                  for a in related
              )
              new_block = (
                  f'<div class="art__related">'
                  f'<div class="art__related-title">À LIRE AUSSI</div>'
                  f'<div class="art__related-grid">{cards}</div>'
                  f'</div>'
              )
              path = f"articles/{fn}"
              html = open(path, encoding="utf-8").read()
              new_html = re.sub(r'<div class="art__related">.*?</div></div>', new_block, html, flags=re.DOTALL)
              if new_html != html:
                  open(path, "w", encoding="utf-8").write(new_html)
                  patched += 1

          print(f"{patched} articles patchés (à lire aussi)")

          # ── Patch couleurs catégorie, disclaimer IA, back-to-top, newsletter ──
          CAT_COLORS = {"societe":"#78716c","environnement":"#22c55e","sante":"#38bdf8",
                        "economie":"#f97316","tech":"#a855f7","science":"#06b6d4"}
          NEWSLETTER_BLOCK = '''<div class="newsletter-block">
    <div class="newsletter-block__title">La semaine en faits</div>
    <div class="newsletter-block__sub">Chaque dimanche. Aucune opinion. Aucun parti pris.</div>
    <form class="newsletter-form" onsubmit="handleNL(event)">
      <input type="email" placeholder="votre@email.com" required autocomplete="email"/>
      <button type="submit">S&#x27;abonner</button>
    </form>
    <div class="newsletter-block__legal">Aucune publicité. Désinscription en un clic.</div>
  </div>'''
          BTT_JS = '''<button class="back-to-top" id="btt" aria-label="Retour en haut" title="Retour en haut">↑</button>
<script>
(function(){
  var btn=document.getElementById('btt');
  window.addEventListener('scroll',function(){btn.classList.toggle('visible',window.scrollY>300);},{passive:true});
  btn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
  function handleNL(e){e.preventDefault();e.target.innerHTML='<p style="color:var(--blue);font-weight:600">✓ Merci ! Vous recevrez votre première newsletter dimanche.</p>';}
  window.handleNL=handleNL;
})();
</script>'''

          patched2 = 0
          for fn in os.listdir("articles"):
              if not fn.endswith(".html"): continue
              slug = fn[:-5]
              art = arts_by_slug.get(slug, {})
              cat = art.get("categorie", "")
              path = f"articles/{fn}"
              html = open(path, encoding="utf-8").read()
              changed = False

              # 1. Couleurs catégorie sur les spans .cat dans les related cards
              if cat and f'cat--{cat}' not in html:
                  html = html.replace(f'<span class="cat">{cat.upper()}</span>',
                                      f'<span class="cat cat--{cat}">{cat.upper()}</span>')
                  changed = True

              # 2. Disclaimer IA (injecter après art__rule si absent)
              if 'art__disclaimer' not in html:
                  disclaimer = f'<div class="art__disclaimer">ℹ️ Cet article a été rédigé par intelligence artificielle selon le <a href="methode.html">Protocole Les Faits v1.1</a>. Des erreurs peuvent subsister. <a href="contact.html?article={slug}#erreur">Signaler une erreur →</a></div>'
                  html = html.replace('<p class="art__resume">', disclaimer + '\n  <p class="art__resume">', 1)
                  changed = True

              # 3. Newsletter avant les articles liés
              if 'newsletter-block' not in html:
                  html = html.replace('<div class="art__related">', NEWSLETTER_BLOCK + '\n  <div class="art__related">', 1)
                  changed = True

              # 4. Back-to-top + JS (avant </body>)
              if 'back-to-top' not in html:
                  html = html.replace('</body>', BTT_JS + '\n</body>', 1)
                  changed = True

              if changed:
                  open(path, "w", encoding="utf-8").write(html)
                  patched2 += 1

          print(f"{patched2} articles patchés (disclaimer + newsletter + back-to-top + couleurs cat)")
          PYEOF

      - name: Déployer vers lesfaits-site
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          TZ: Europe/Paris
        run: |
          git clone https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git /tmp/site

          cp -r articles/             /tmp/site/
          cp -r categories/           /tmp/site/
          cp -r assets/               /tmp/site/
          cp -r data/                 /tmp/site/
          cp    index.html            /tmp/site/
          cp    archive.html          /tmp/site/
          cp    feed.xml              /tmp/site/
          cp    sitemap.xml           /tmp/site/
          cp    robots.txt            /tmp/site/ 2>/dev/null || true
          cp    manifest.json         /tmp/site/ 2>/dev/null || true
          cp    recherche.html        /tmp/site/
          cp    mentions-legales.html /tmp/site/
          cp    confidentialite.html  /tmp/site/ 2>/dev/null || true
          cp    cgu.html              /tmp/site/ 2>/dev/null || true
          cp    contact.html          /tmp/site/ 2>/dev/null || true
          cp    methode.html          /tmp/site/ 2>/dev/null || true
          cp    corrections.html      /tmp/site/ 2>/dev/null || true
          cp -r src/                  /tmp/site/ 2>/dev/null || true

          cd /tmp/site
          git config user.name  "Factuel Bot"
          git config user.email "bot@factuel.fr"
          git add -A
          git diff --cached --quiet && echo "Aucun changement à déployer." && exit 0

          NB=$(git diff --cached --name-only | grep "^articles/" | wc -l)
          CRENEAU=$([ $(date +%H) -lt 12 ] && echo "07h00" || echo "18h00")
          git commit -m "✦ ${NB} article(s) publiés — ${CRENEAU} — $(date +'%d/%m/%Y')"
          git push
