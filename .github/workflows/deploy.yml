name: Factuel — Déploiement site

on:
  schedule:
    # Matin : déploiement à 05h00 UTC = 07h00 Paris
    - cron: "0 5 * * *"
    # Soir : déploiement à 16h00 UTC = 18h00 Paris
    - cron: "0 16 * * *"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Cloner lesfaits-site
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git /tmp/site
          # Récupérer articles + assets + data déjà publiés
          cp -r /tmp/site/articles/ ./
          cp -r /tmp/site/assets/   ./
          cp -r /tmp/site/data/     ./

      - name: Rebuild index + catégories + archive
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: python scripts/pipeline.py --rebuild

      - name: Patcher les sections À lire aussi
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 - << 'PYEOF'
          import json, re, os

          with open("data/search.json", encoding="utf-8") as f:
              all_arts = json.load(f)
          arts_by_slug = {a["slug"]: a for a in all_arts}

          patched = 0
          for fn in os.listdir("articles"):
              if not fn.endswith(".html"): continue
              slug = fn[:-5]
              art = arts_by_slug.get(slug)
              if not art: continue
              cat = art.get("categorie", "")
              related = [a for a in all_arts if a.get("categorie") == cat and a["slug"] != slug][:3]
              if not related: continue

              cards = "\n".join(
                  f'<a class="art__related-card" href="articles/{a["slug"]}.html">'
                  f'<img src="assets/images/{a["slug"]}.jpg" alt="" loading="lazy" style="width:calc(100% + 32px);margin:-14px -16px 12px;height:110px;object-fit:cover;display:block;border-radius:var(--radius) var(--radius) 0 0">'
                  f'<span class="cat">{a["categorie"].upper()}</span>'
                  f'<div class="title-sm">{a["titre"]}</div>'
                  f'<div style="font-size:10px;color:var(--muted);margin-top:6px">{a["date"]}</div>'
                  f'</a>'
                  for a in related
              )
              new_block = (
                  f'<div class="art__related">'
                  f'<div class="art__related-title">À LIRE AUSSI</div>'
                  f'<div class="art__related-grid">{cards}</div>'
                  f'</div>'
              )
              path = f"articles/{fn}"
              html = open(path, encoding="utf-8").read()
              new_html = re.sub(r'<div class="art__related">.*?</div></div>', new_block, html, flags=re.DOTALL)
              if new_html != html:
                  open(path, "w", encoding="utf-8").write(new_html)
                  patched += 1

          print(f"{patched} articles patchés (à lire aussi)")
          PYEOF

      - name: Copier tout vers lesfaits-site et pousser
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          TZ: Europe/Paris
        run: |
          cp -r articles/             /tmp/site/
          cp -r categories/           /tmp/site/
          cp -r assets/               /tmp/site/
          cp -r data/                 /tmp/site/
          cp    index.html            /tmp/site/
          cp    archive.html          /tmp/site/
          cp    feed.xml              /tmp/site/
          cp    sitemap.xml           /tmp/site/
          cp    robots.txt            /tmp/site/ 2>/dev/null || true
          cp    manifest.json         /tmp/site/ 2>/dev/null || true
          cp    recherche.html        /tmp/site/
          cp    mentions-legales.html /tmp/site/
          cp    confidentialite.html  /tmp/site/ 2>/dev/null || true
          cp    cgu.html              /tmp/site/ 2>/dev/null || true
          cp    contact.html          /tmp/site/ 2>/dev/null || true
          cp    methode.html          /tmp/site/ 2>/dev/null || true
          cp    corrections.html      /tmp/site/ 2>/dev/null || true
          cp -r src/                  /tmp/site/ 2>/dev/null || true

          cd /tmp/site
          git config user.name  "Factuel Bot"
          git config user.email "bot@factuel.fr"
          git add -A
          git diff --cached --quiet && echo "Aucun changement à déployer." && exit 0

          NB=$(git diff --cached --name-only | grep "^articles/" | wc -l)
          CRENEAU=$([ $(date +%H) -lt 12 ] && echo "07h00" || echo "18h00")
          git commit -m "✦ ${NB} article(s) publiés — ${CRENEAU} — $(date +'%d/%m/%Y')"
          git push
