name: Factuel — Déploiement site

on:
  push:
    branches: [main]
    paths:
      - "src/newsletter.js"
      - "scripts/harden_newsletter.py"
      - "scripts/harden_newsletter_v3.py"
      - "scripts/normalize_sitemap_lastmod.py"
      - "scripts/test_sitemap_lastmod.py"
      - "scripts/normalize_feed_pubdates.py"
      - "scripts/test_feed_pubdates.py"
      - ".github/workflows/deploy.yml"
  schedule:
    # NOTE : les crons GitHub sont fréquemment retardés de 1 à 4h. On planifie
    # dix minutes avant l'heure cible sur une minute non ronde.
    # Matin ~07h00 Paris — été (CEST UTC+2) : avril–octobre
    - cron: "50 4 * 4-10 *"
    # Matin ~07h00 Paris — hiver (CET UTC+1) : novembre–mars
    - cron: "50 5 * 11-12,1-3 *"
    # Soir ~18h00 Paris — été (CEST UTC+2) : avril–octobre
    - cron: "50 15 * 4-10 *"
    # Soir ~18h00 Paris — hiver (CET UTC+1) : novembre–mars
    - cron: "50 16 * 11-12,1-3 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run — affiche les sujets sélectionnés sans générer ni déployer'
        required: false
        default: 'false'
        type: boolean
      forcer:
        description: "Forcer même si rien de neuf depuis le dernier déploiement"
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: factuel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Checkout (repo privé — contient tous les articles)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ignorer si rien de neuf à déployer
        id: garde
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCER: ${{ inputs.forcer }}
        run: |
          if [ "$FORCER" = "true" ]; then
            echo "Forçage demandé — garde-fou ignoré."
            echo "passer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?per_page=30" \
            > /tmp/runs.json || echo '{}' > /tmp/runs.json
          DERNIER_SHA=$(python3 scripts/dernier_run.py /tmp/runs.json "$GITHUB_RUN_ID" --sha)
          echo "SHA courant : ${GITHUB_SHA}"
          echo "SHA du dernier déploiement réussi : ${DERNIER_SHA:-aucun}"
          if [ -n "$DERNIER_SHA" ] && [ "$DERNIER_SHA" = "$GITHUB_SHA" ]; then
            echo "::notice::Déploiement ignoré — le site est déjà à jour sur ce commit. Option « forcer » pour republier quand même."
            echo "passer=true" >> "$GITHUB_OUTPUT"
          else
            echo "passer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.garde.outputs.passer != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        if: steps.garde.outputs.passer != 'true'
        run: pip install -r requirements.txt

      - name: Rebuild index + catégories + archive
        if: steps.garde.outputs.passer != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/pipeline.py --dry-run
          else
            python scripts/pipeline.py --rebuild
          fi

      - name: Normaliser les dates réelles du sitemap et du RSS
        if: ${{ steps.garde.outputs.passer != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/normalize_sitemap_lastmod.py
          python scripts/normalize_sitemap_lastmod.py --check
          python scripts/normalize_feed_pubdates.py
          python scripts/normalize_feed_pubdates.py --check

      - name: Patcher les articles (à lire aussi + disclaimer + newsletter + back-to-top)
        if: ${{ steps.garde.outputs.passer != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/patch_articles.py

      - name: Normaliser et auditer tous les formulaires newsletter v3
        if: ${{ steps.garde.outputs.passer != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/harden_newsletter_v3.py
          python scripts/harden_newsletter_v3.py --check
          node --check src/newsletter.js
          node --check src/search-preview.js

      - name: Test non-régression SEO (bloque le déploiement en cas d'échec)
        if: ${{ steps.garde.outputs.passer != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/check_seo.py

      - name: Déployer vers lesfaits-site
        if: ${{ steps.garde.outputs.passer != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          TZ: Europe/Paris
        run: |
          : > "${GITHUB_WORKSPACE}/new_articles.txt"
          git clone https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git /tmp/site

          PRIVATE_ARTICLES="${GITHUB_WORKSPACE}/articles"
          shopt -s nullglob
          for f in /tmp/site/articles/*.html; do
            slug=$(basename "$f") && [ ! -f "${PRIVATE_ARTICLES}/${slug}" ] && rm "$f" && echo "Supprimé: $slug"
          done
          shopt -u nullglob

          cp -r articles/             /tmp/site/
          cp -r categories/           /tmp/site/
          cp -r assets/               /tmp/site/
          cp -r data/                 /tmp/site/
          cp    index.html            /tmp/site/
          cp    archive.html          /tmp/site/
          cp    breves.html           /tmp/site/
          cp    feed.xml              /tmp/site/
          cp    sitemap.xml           /tmp/site/
          cp    robots.txt            /tmp/site/ 2>/dev/null || true
          cp    manifest.json         /tmp/site/ 2>/dev/null || true
          cp    favicon.svg           /tmp/site/ 2>/dev/null || true
          cp    favicon.ico           /tmp/site/ 2>/dev/null || true
          cp    favicon-16x16.png     /tmp/site/ 2>/dev/null || true
          cp    favicon-32x32.png     /tmp/site/ 2>/dev/null || true
          cp    apple-touch-icon.png  /tmp/site/ 2>/dev/null || true
          cp    recherche.html        /tmp/site/
          cp    mentions-legales.html /tmp/site/
          cp    confidentialite.html  /tmp/site/ 2>/dev/null || true
          cp    cgu.html              /tmp/site/ 2>/dev/null || true
          cp    contact.html          /tmp/site/ 2>/dev/null || true
          cp    methode.html          /tmp/site/ 2>/dev/null || true
          cp    a-propos.html         /tmp/site/ 2>/dev/null || true
          cp    corrections.html      /tmp/site/ 2>/dev/null || true
          cp    404.html              /tmp/site/ 2>/dev/null || true
          cp    favoris.html          /tmp/site/ 2>/dev/null || true
          cp    confirmation.html     /tmp/site/ 2>/dev/null || true
          cp    desabonnement.html    /tmp/site/ 2>/dev/null || true
          cp -r src/                  /tmp/site/ 2>/dev/null || true
          rm -rf /tmp/site/devenir

          # Toute page HTML racine générée doit être présente dans le site.
          manquantes=""
          for f in *.html; do
            [ -f "/tmp/site/$f" ] || manquantes="$manquantes $f"
          done
          if [ -n "$manquantes" ]; then
            echo "::error::Page(s) générée(s) mais NON copiée(s) vers lesfaits-site :$manquantes"
            exit 1
          fi

          cd /tmp/site
          git config user.name  "Factuel Bot"
          git config user.email "bot@factuel.fr"

          # Re-normaliser les métadonnées face au HEAD réellement public : le dépôt
          # source peut contenir du bruit de rebuild qui ne doit ni avancer les
          # lastmod du sitemap, ni le lastBuildDate du RSS sur un lot sans article.
          python "${GITHUB_WORKSPACE}/scripts/normalize_sitemap_lastmod.py" --root /tmp/site
          python "${GITHUB_WORKSPACE}/scripts/normalize_sitemap_lastmod.py" --root /tmp/site --check
          python "${GITHUB_WORKSPACE}/scripts/normalize_feed_pubdates.py" --root /tmp/site
          python "${GITHUB_WORKSPACE}/scripts/normalize_feed_pubdates.py" --root /tmp/site --check

          git add -A
          git diff --cached --quiet && echo "Aucun changement à déployer." && exit 0

          # Compter uniquement les créations. Les anciens articles reconstruits
          # ne sont plus annoncés comme de nouvelles publications.
          NB_NEW=$(git diff --cached --name-only --diff-filter=A -- articles/ | grep -E '\.html$' | wc -l | tr -d ' ')
          NB_MOD=$(git diff --cached --name-only --diff-filter=M -- articles/ | grep -E '\.html$' | wc -l | tr -d ' ')
          NB_DEL=$(git diff --cached --name-only --diff-filter=D -- articles/ | grep -E '\.html$' | wc -l | tr -d ' ')
          CRENEAU=$([ $(date +%H) -lt 12 ] && echo "07h00" || echo "18h00")

          {
            echo "## Déploiement public"
            echo ""
            echo "- Nouveaux articles : ${NB_NEW}"
            echo "- Articles reconstruits : ${NB_MOD}"
            echo "- Articles retirés : ${NB_DEL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$NB_NEW" -gt 0 ]; then
            MESSAGE="✦ ${NB_NEW} nouveau(x) article(s) publié(s) — ${CRENEAU} — $(date +'%d/%m/%Y')"
          else
            MESSAGE="chore: mise à jour du site — 0 nouvel article — ${CRENEAU} — $(date +'%d/%m/%Y')"
          fi
          git commit -m "$MESSAGE"

          # Sceller les heures publiques dans le même commit que le déploiement.
          # Cela évite qu'un rebuild republie des libellés visibles par défaut si
          # le workflow post-déploiement n'est pas déclenché ou arrive en retard.
          python "${GITHUB_WORKSPACE}/scripts/stamp_publication_times.py" \
            --site-dir /tmp/site --previous-ref HEAD~1

          # L'estampillage peut remettre les HTML de catégorie exactement à leur
          # état public canonique. Recalculer ensuite le sitemap empêche de conserver
          # un lastmod du jour issu du rebuild alors que la page finale n'a pas changé.
          python "${GITHUB_WORKSPACE}/scripts/normalize_sitemap_lastmod.py" --root /tmp/site
          python "${GITHUB_WORKSPACE}/scripts/normalize_sitemap_lastmod.py" --root /tmp/site --check

          git add -A
          git diff --cached --quiet || git commit --amend --no-edit

          git diff --name-only --diff-filter=A HEAD~1 HEAD -- articles/ \
            | sed 's|^articles/||; s|\.html$||' > "${GITHUB_WORKSPACE}/new_articles.txt" || true

          git push

      - name: Sauvegarder les slugs pour publication X (07h00)
        if: ${{ steps.garde.outputs.passer != 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -s "${GITHUB_WORKSPACE}/new_articles.txt" ]; then
            cp "${GITHUB_WORKSPACE}/new_articles.txt" data/pending_x_posts.txt
            git config user.name  "Factuel Bot"
            git config user.email "bot@lesfaits.info"
            git add data/pending_x_posts.txt
            git diff --cached --quiet || git commit -m "chore: slugs en attente de publication X"
            git push
          fi
