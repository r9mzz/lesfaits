name: Factuel — Déploiement site

on:
  schedule:
    # NOTE : les crons GitHub sont fréquemment retardés de 1 à 4h (le 02/07 le
    # créneau de 05h00 UTC n'a jamais été exécuté ; la veille il est parti avec
    # 3h50 de retard). On planifie donc 10 min avant l'heure cible sur une
    # minute non ronde : au mieux la publication part à 06h50/17h50 Paris, avec
    # le retard habituel elle reste proche de 07h/18h au lieu de 10h+.
    # Matin ~07h00 Paris — été (CEST UTC+2) : avril–octobre
    - cron: "50 4 * 4-10 *"
    # Matin ~07h00 Paris — hiver (CET UTC+1) : novembre–mars
    - cron: "50 5 * 11-12,1-3 *"
    # Soir ~18h00 Paris — été (CEST UTC+2) : avril–octobre
    - cron: "50 15 * 4-10 *"
    # Soir ~18h00 Paris — hiver (CET UTC+1) : novembre–mars
    - cron: "50 16 * 11-12,1-3 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run — affiche les sujets sélectionnés sans générer ni déployer'
        required: false
        default: 'false'
        type: boolean
      forcer:
        description: "Forcer même si rien de neuf depuis le dernier déploiement"
        required: false
        default: 'false'
        type: boolean

# Deux déploiements simultanés pourraient pousser des commits concurrents ou
# des suppressions d'articles incohérentes sur lesfaits-site — en file, pas
# annulés, pour ne jamais interrompre un déploiement déjà en cours.
concurrency:
  group: factuel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout (repo privé — contient tous les articles)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Garde-fou : ne pas redéployer un contenu identique ───────────────
      # Un automate EXTERNE au dépôt déclenche deploy.yml à 04h00 ET 04h50 UTC
      # chaque jour (constat 28/07, 5 jours consécutifs) — le second arrive
      # 50 min après le premier, sans qu'aucune génération n'ait eu lieu entre
      # les deux : il republie exactement le même contenu. On compare donc le
      # SHA courant à celui du dernier déploiement réussi. Critère volontaire-
      # ment fondé sur le contenu et non sur le temps : un déploiement ne doit
      # JAMAIS être bloqué s'il a réellement des articles neufs à publier.
      - name: Ignorer si rien de neuf à déployer
        id: garde
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCER: ${{ inputs.forcer }}
        run: |
          if [ "$FORCER" = "true" ]; then
            echo "Forçage demandé — garde-fou ignoré."
            echo "passer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?per_page=30" \
            > /tmp/runs.json || echo '{}' > /tmp/runs.json
          DERNIER_SHA=$(python3 scripts/dernier_run.py /tmp/runs.json "$GITHUB_RUN_ID" --sha)
          echo "SHA courant : ${GITHUB_SHA}"
          echo "SHA du dernier déploiement réussi : ${DERNIER_SHA:-aucun}"
          if [ -n "$DERNIER_SHA" ] && [ "$DERNIER_SHA" = "$GITHUB_SHA" ]; then
            echo "::notice::Déploiement ignoré — le site est déjà à jour sur ce commit. Option « forcer » pour republier quand même."
            echo "passer=true" >> "$GITHUB_OUTPUT"
          else
            echo "passer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.garde.outputs.passer != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        if: steps.garde.outputs.passer != 'true'
        run: pip install -r requirements.txt

      - name: Rebuild index + catégories + archive
        if: steps.garde.outputs.passer != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/pipeline.py --dry-run
          else
            python scripts/pipeline.py --rebuild
          fi

      - name: Patcher les articles (à lire aussi + disclaimer + newsletter + back-to-top)
        if: ${{ steps.garde.outputs.passer != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/patch_articles.py

      - name: Test non-régression SEO (bloque le déploiement en cas d'échec)
        if: ${{ steps.garde.outputs.passer != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/check_seo.py

      - name: Déployer vers lesfaits-site
        if: ${{ steps.garde.outputs.passer != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          TZ: Europe/Paris
        run: |
          # Fichier consommé par l'étape "Publier sur X" (vide si rien de neuf)
          : > "${GITHUB_WORKSPACE}/new_articles.txt"

          git clone https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git /tmp/site

          # Supprimer les articles retirés de la source
          PRIVATE_ARTICLES="${GITHUB_WORKSPACE}/articles"
          shopt -s nullglob
          for f in /tmp/site/articles/*.html; do
            slug=$(basename "$f") && [ ! -f "${PRIVATE_ARTICLES}/${slug}" ] && rm "$f" && echo "Supprimé: $slug"
          done
          shopt -u nullglob

          cp -r articles/             /tmp/site/
          cp -r categories/           /tmp/site/
          cp -r assets/               /tmp/site/
          cp -r data/                 /tmp/site/
          cp    index.html            /tmp/site/
          cp    archive.html          /tmp/site/
          cp    feed.xml              /tmp/site/
          cp    sitemap.xml           /tmp/site/
          cp    robots.txt            /tmp/site/ 2>/dev/null || true
          cp    manifest.json         /tmp/site/ 2>/dev/null || true
          cp    favicon.svg           /tmp/site/ 2>/dev/null || true
          cp    favicon.ico           /tmp/site/ 2>/dev/null || true
          cp    favicon-16x16.png     /tmp/site/ 2>/dev/null || true
          cp    favicon-32x32.png     /tmp/site/ 2>/dev/null || true
          cp    apple-touch-icon.png  /tmp/site/ 2>/dev/null || true
          cp    recherche.html        /tmp/site/
          cp    mentions-legales.html /tmp/site/
          cp    confidentialite.html  /tmp/site/ 2>/dev/null || true
          cp    cgu.html              /tmp/site/ 2>/dev/null || true
          cp    contact.html          /tmp/site/ 2>/dev/null || true
          cp    methode.html          /tmp/site/ 2>/dev/null || true
          cp    a-propos.html         /tmp/site/ 2>/dev/null || true
          cp    corrections.html      /tmp/site/ 2>/dev/null || true
          cp    404.html             /tmp/site/ 2>/dev/null || true
          cp    favoris.html          /tmp/site/ 2>/dev/null || true
          cp    confirmation.html     /tmp/site/ 2>/dev/null || true
          cp    desabonnement.html    /tmp/site/ 2>/dev/null || true
          cp -r src/                  /tmp/site/ 2>/dev/null || true
          # L'app perso "Devenir" a été brièvement déployée le 18/07 puis
          # retirée (aucun lien voulu avec lesfaits.info) — on purge le
          # dossier du site à chaque déploiement pour garantir sa disparition.
          rm -rf /tmp/site/devenir

          cd /tmp/site
          git config user.name  "Factuel Bot"
          git config user.email "bot@factuel.fr"
          git add -A
          git diff --cached --quiet && echo "Aucun changement à déployer." && exit 0

          NB=$(git diff --cached --name-only | grep "^articles/" | wc -l)
          CRENEAU=$([ $(date +%H) -lt 12 ] && echo "07h00" || echo "18h00")
          git commit -m "✦ ${NB} article(s) publiés — ${CRENEAU} — $(date +'%d/%m/%Y')"

          # Slugs des articles AJOUTÉS par ce déploiement → pour la publication X
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- articles/ \
            | sed 's|^articles/||; s|\.html$||' > "${GITHUB_WORKSPACE}/new_articles.txt" || true

          git push

      - name: Sauvegarder les slugs pour publication X (07h00)
        if: ${{ steps.garde.outputs.passer != 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          # Les slugs des nouveaux articles sont publiés sur X par post_x.yml
          # à 07h00 Paris (05h00 UTC), séparément du déploiement.
          if [ -s "${GITHUB_WORKSPACE}/new_articles.txt" ]; then
            cp "${GITHUB_WORKSPACE}/new_articles.txt" data/pending_x_posts.txt
            git config user.name  "Factuel Bot"
            git config user.email "bot@lesfaits.info"
            git add data/pending_x_posts.txt
            git diff --cached --quiet || git commit -m "chore: slugs en attente de publication X"
            git push
          fi
