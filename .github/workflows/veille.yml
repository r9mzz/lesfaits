name: Veille continue

# PHASE 1 — OBSERVER, MESURER, NE RIEN DÉCIDER (12/08, idée de Nahil).
#
# Le pipeline regarde les flux deux fois par jour et doit choisir un sujet sur
# une PHOTO. À 3 h du matin, une dépêche tombée il y a dix minutes n'a été
# reprise par personne : elle est indiscernable d'un sujet mort. C'est le TEMPS
# qui sépare les deux, et un run ponctuel ne l'a pas.
#
# Ce workflow ne touche NI à la génération, NI au déploiement, NI au quota
# Groq (aucun token consommé : uniquement la lecture des flux RSS). Il écrit
# un seul fichier, `data/veille.json`, que rien d'autre ne lit aujourd'hui.
#
# Les seuils d'importance seront fixés SUR les distributions relevées ici,
# jamais avant — c'est la règle du projet, et celle qu'on a violée trois fois
# de suite sur le filtre anti-doublon (26/07, 28/07, 02/08).

on:
  schedule:
    # Toutes les heures. Les crons GitHub ont 1 à 4 h de retard chez nous
    # (constat du 28/07), donc la cadence réelle sera irrégulière — sans
    # importance ici : ce qu'on mesure est la persistance sur plusieurs heures,
    # pas la minute d'apparition.
    - cron: "0 * * * *"
  workflow_dispatch:

# Un seul passage à la fois. Deux passages concurrents écriraient le même
# fichier et le second perdrait les observations du premier.
concurrency:
  group: veille
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Passage de veille
        env:
          PYTHONIOENCODING: utf-8
          TZ: Europe/Paris
        run: python scripts/veille.py

      - name: Enregistrer le journal
        run: |
          set -e
          git config user.name  "veille-bot"
          git config user.email "bot@lesfaits.info"

          # `data/veille.json` UNIQUEMENT. La veille n'a aucune raison de
          # toucher à un autre fichier, et un `git add -A` ici embarquerait un
          # jour un artefact de build dans un commit horaire.
          git add data/veille.json
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à commiter."
            exit 0
          fi
          git commit -m "veille : passage du $(date -u +'%d/%m %H:%M') UTC"

          # Le pipeline et le déploiement commitent sur la même branche. Un
          # passage horaire qui échoue son push doit réessayer, jamais écraser :
          # `--rebase` rejoue notre commit par-dessus, et comme nous sommes le
          # seul écrivain de ce fichier il ne peut pas y avoir de conflit
          # réel dessus.
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push échoué (tentative $i) — nouvelle tentative."
            sleep $((2 ** i))
          done
          echo "::warning::Journal de veille non poussé après 4 tentatives — " \
               "les observations de ce passage sont perdues, le suivant reprendra."
