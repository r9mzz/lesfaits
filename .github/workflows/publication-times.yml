name: Horodatage réel des publications

on:
  pull_request:
    paths:
      - "scripts/stamp_publication_times.py"
      - "scripts/run_publication_times.py"
      - "scripts/test_stamp_publication_times.py"
      - "scripts/test_publication_time_legacy_rebuild.py"
      - "scripts/repair_jsonld_modified_dates.py"
      - "scripts/test_repair_jsonld_modified_dates.py"
      - "scripts/test_publication_times_workflow_contract.py"
      - ".github/workflows/publication-times.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Factuel — Déploiement site"]
    types: [completed]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérifier la syntaxe
        run: |
          python -m py_compile \
            scripts/stamp_publication_times.py \
            scripts/run_publication_times.py \
            scripts/test_stamp_publication_times.py \
            scripts/test_publication_time_legacy_rebuild.py \
            scripts/repair_jsonld_modified_dates.py \
            scripts/test_repair_jsonld_modified_dates.py \
            scripts/test_publication_times_workflow_contract.py
      - name: Tester l’horodatage public
        run: |
          python scripts/test_stamp_publication_times.py
          python scripts/test_publication_time_legacy_rebuild.py
          python scripts/test_repair_jsonld_modified_dates.py
          python scripts/test_publication_times_workflow_contract.py

  stamp:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publication-time-stamp
      cancel-in-progress: false
    steps:
      - name: Checkout du moteur
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cloner le site public
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/r9mzz/lesfaits-site.git /tmp/site

      - name: Détecter les articles touchés par le déploiement
        id: articles
        run: |
          NB_ARTICLES=$(git -C /tmp/site diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'articles/*.html' | wc -l | tr -d ' ')
          echo "count=$NB_ARTICLES" >> "$GITHUB_OUTPUT"
          if [ "$NB_ARTICLES" -eq 0 ]; then
            echo "Aucun article ajouté ou reconstruit dans le dernier déploiement public — horodatage inutile."
          else
            echo "$NB_ARTICLES article(s) ajouté(s) ou reconstruit(s) à contrôler."
          fi

      - name: Appliquer l’heure réelle du déploiement
        if: steps.articles.outputs.count != '0'
        run: |
          PUBLISHED_AT=$(git -C /tmp/site show -s --format=%cI HEAD)
          echo "Commit public horodaté : $PUBLISHED_AT"
          python scripts/run_publication_times.py \
            --site-dir /tmp/site \
            --previous-ref HEAD~1 \
            --published-at "$PUBLISHED_AT"
          python scripts/repair_jsonld_modified_dates.py --site-dir /tmp/site
          python scripts/repair_jsonld_modified_dates.py --site-dir /tmp/site --check

      - name: Publier les horodatages corrigés
        if: steps.articles.outputs.count != '0'
        working-directory: /tmp/site
        run: |
          git config user.name "Factuel Bot"
          git config user.email "bot@lesfaits.info"
          git add -A
          git diff --cached --quiet && echo "Aucun horaire à corriger." && exit 0
          NB=$(git diff --cached --name-only --diff-filter=M -- articles/ | wc -l)
          git commit -m "fix: heure réelle de publication — ${NB} article(s) aligné(s)"
          git push
