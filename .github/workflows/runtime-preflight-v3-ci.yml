name: Runtime preflight V3 CI

on:
  pull_request:
    paths:
      - "feed.xml"
      - "sitemap.xml"
      - "scripts/pipeline.py"
      - "scripts/fenetres_modeles.py"
      - "scripts/modele_fournisseur.py"
      - "scripts/run_pipeline_v3.py"
      - "scripts/provider_runtime_guard.py"
      - "scripts/test_runtime_preflight_v3.py"
      - "scripts/test_run_pipeline_v3.py"
      - "scripts/test_trusted_source_expansion.py"
      - "scripts/test_verification_scope.py"
      - "scripts/test_pertinence_bloquant.py"
      - "scripts/test_runtime_newsletter_v3.py"
      - "scripts/test_runtime_groq_model_v3.py"
      - "scripts/test_provider_runtime_guard.py"
      - "scripts/test_fenetre_essai_isolation.py"
      - ".github/workflows/essai_fournisseur.yml"
      - "scripts/normalize_feed_pubdates.py"
      - "scripts/test_feed_pubdates.py"
      - "scripts/test_feed_current_state.py"
      - "scripts/test_runtime_feed_pubdates_v3.py"
      - "scripts/normalize_sitemap_lastmod.py"
      - "scripts/test_sitemap_lastmod.py"
      - "scripts/test_sitemap_current_state.py"
      - "scripts/test_runtime_sitemap_v3.py"
      - "scripts/test_runtime_preflight_ci_contract.py"
      - "scripts/test_fenetres_modeles_ci_contract.py"
      - ".github/workflows/runtime-preflight-v3-ci.yml"

permissions:
  contents: read

jobs:
  runtime-preflight-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Syntaxe
        run: >-
          python -m py_compile
          scripts/pipeline.py
          scripts/fenetres_modeles.py
          scripts/modele_fournisseur.py
          scripts/run_pipeline_v3.py
          scripts/provider_runtime_guard.py
          scripts/test_runtime_preflight_v3.py
          scripts/test_run_pipeline_v3.py
          scripts/test_trusted_source_expansion.py
          scripts/test_verification_scope.py
          scripts/test_pertinence_bloquant.py
          scripts/test_runtime_newsletter_v3.py
          scripts/test_runtime_groq_model_v3.py
          scripts/test_provider_runtime_guard.py
          scripts/test_fenetre_essai_isolation.py
          scripts/normalize_feed_pubdates.py
          scripts/test_feed_pubdates.py
          scripts/test_feed_current_state.py
          scripts/test_runtime_feed_pubdates_v3.py
          scripts/normalize_sitemap_lastmod.py
          scripts/test_sitemap_lastmod.py
          scripts/test_sitemap_current_state.py
          scripts/test_runtime_sitemap_v3.py
          scripts/test_runtime_preflight_ci_contract.py
          scripts/test_fenetres_modeles_ci_contract.py
      - name: Vérifier le verrou runtime
        run: python scripts/test_runtime_preflight_v3.py
      - name: Vérifier le contrat CI du prévol
        run: |
          python scripts/test_runtime_preflight_ci_contract.py
          python scripts/test_fenetres_modeles_ci_contract.py
      - name: Vérifier l'isolation de la fenêtre d'essai
        run: |
          PYTHONPATH=scripts python scripts/test_fenetre_essai_isolation.py
          grep -q 'ESSAI_FOURNISSEUR: "1"' .github/workflows/essai_fournisseur.yml
      - name: Vérifier la normalisation des dates RSS
        run: |
          python scripts/test_feed_pubdates.py
          python scripts/test_feed_current_state.py
          python scripts/test_runtime_feed_pubdates_v3.py
      - name: Vérifier la normalisation des dates sitemap
        run: |
          python scripts/test_sitemap_lastmod.py
          python scripts/test_sitemap_current_state.py
          python scripts/test_runtime_sitemap_v3.py
      - name: Rejouer exactement la suite runtime V3
        run: |
          python scripts/test_run_pipeline_v3.py
          python scripts/test_trusted_source_expansion.py
          python scripts/test_verification_scope.py
          python scripts/test_pertinence_bloquant.py
          python scripts/test_runtime_feed_pubdates_v3.py
          python scripts/test_runtime_sitemap_v3.py
          python scripts/test_runtime_newsletter_v3.py
          python scripts/test_runtime_groq_model_v3.py
          python scripts/test_provider_runtime_guard.py
