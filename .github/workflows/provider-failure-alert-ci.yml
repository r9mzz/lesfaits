name: Provider failure alert contract

on:
  pull_request:
    paths:
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/provider-failure-alert-ci.yml"
      - "scripts/test_provider_failure_alert.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/provider-failure-alert-ci.yml"
      - "scripts/test_provider_failure_alert.py"

permissions:
  contents: read

jobs:
  provider-failure-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérifier le diagnostic fournisseur
        run: python scripts/test_provider_failure_alert.py
