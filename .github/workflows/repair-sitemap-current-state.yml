name: Repair sitemap current state

on:
  push:
    branches:
      - agent/repair-sitemap-current-state

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[sitemap-state-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-sitemap-current-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normaliser l'état versionné
        run: |
          python scripts/normalize_sitemap_lastmod.py
          python scripts/test_sitemap_current_state.py
      - name: Retirer ce workflow one-shot et pousser la réparation
        run: |
          rm .github/workflows/repair-sitemap-current-state.yml
          git config user.name 'lesfaits-ci'
          git config user.email 'ci@lesfaits.info'
          git add sitemap.xml scripts/test_sitemap_current_state.py .github/workflows/runtime-preflight-v3-ci.yml .github/workflows/repair-sitemap-current-state.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'fix: repair committed sitemap lastmod [sitemap-state-fixed]'
          git push origin HEAD:agent/repair-sitemap-current-state
